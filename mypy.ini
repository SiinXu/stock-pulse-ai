# Type-checking ratchet for StockPulse.
#
# Scope is intentionally narrow: only src/schemas/ is checked. Do not enable
# repo-wide mypy here. Expand by adding packages under [mypy] files after that
# package is clean on its own. See docs/type-checking.md.
#
# Run:
#   python -m mypy --config-file mypy.ini
#
# follow-imports=skip keeps the rest of the tree out of the check so this
# package can ratchet independently.

[mypy]
python_version = 3.10
files = src/schemas
follow_imports = skip
namespace_packages = True
explicit_package_bases = True
show_error_codes = True
warn_unused_configs = True
pretty = True
# No per-module exclusions yet: all 17 files under src/schemas/ pass.
