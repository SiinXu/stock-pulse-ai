# Type-checking ratchet for StockPulse.
#
# Scope is intentionally narrow: only the packages listed under files= are
# checked. Do not enable repo-wide mypy here. Expand by adding packages under
# [mypy] files after that package is clean on its own. See docs/type-checking.md.
#
# Run:
#   python -m mypy --config-file mypy.ini
#
# follow-imports=skip keeps the rest of the tree out of the check so these
# packages can ratchet independently. Measured 2026-08-05: enabling
# follow_imports=normal for src/schemas + api/v1/schemas pulled 261 transitive
# modules with 2745 errors (config_parts, data_provider, core stages, etc.).
# Keep skip until a later PR deliberately widens import following.

[mypy]
python_version = 3.10
files = src/schemas, api/v1/schemas
follow_imports = skip
namespace_packages = True
explicit_package_bases = True
show_error_codes = True
warn_unused_configs = True
pretty = True
# No per-module exclusions yet: all modules under the listed packages pass.
