<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151514" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StockPulse" />
    <script>
      (() => {
        const storageKey = 'theme';
        const packKey = 'theme-pack';
        const priceDirectionKey = 'price-direction';
        const root = document.documentElement;
        const storedTheme = localStorage.getItem(storageKey);
        const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'dark';
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.style.colorScheme = theme;
        // Theme Contract v1: pack + market price-direction before paint (default CN red-up).
        const storedPack = localStorage.getItem(packKey);
        const pack = storedPack === 'slate' || storedPack === 'classic' ? storedPack : 'classic';
        root.setAttribute('data-theme-pack', pack);
        const storedPriceDirection = localStorage.getItem(priceDirectionKey);
        const priceDirection = storedPriceDirection === 'us' || storedPriceDirection === 'cn'
          ? storedPriceDirection
          : 'cn';
        root.setAttribute('data-price-direction', priceDirection);
        // Keep the browser chrome color aligned with the FOUC theme choice.
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute('content', theme === 'light' ? '#F7F8F7' : '#151514');
        }
        // Canonical stored UI language only. Full browser-locale normalization
        // happens in main.tsx before createRoot; do not persist from this script.
        const htmlLangByLanguage = {
          zh: 'zh-CN',
          'zh-TW': 'zh-TW',
          en: 'en',
          ja: 'ja',
          ko: 'ko',
          de: 'de',
          es: 'es',
          ms: 'ms',
          fr: 'fr',
          id: 'id',
        };
        const storedLanguage = localStorage.getItem('dsa.uiLanguage');
        if (storedLanguage && Object.prototype.hasOwnProperty.call(htmlLangByLanguage, storedLanguage)) {
          root.lang = htmlLangByLanguage[storedLanguage];
        }
      })();
    </script>
    <style>
      /* Non-textual nav frame for first paint. Uses the same chrome colors as
         the FOUC theme-color script so the shell is visible before JS/CSS. */
      [data-locale-neutral-shell] {
        display: flex;
        min-height: 100dvh;
        box-sizing: border-box;
        background: #151514;
      }
      html.light [data-locale-neutral-shell] {
        background: #F7F8F7;
      }
      [data-locale-neutral-shell]::before,
      [data-locale-neutral-shell]::after {
        content: "";
        display: block;
        box-sizing: border-box;
      }
      [data-locale-neutral-shell]::before {
        flex-shrink: 0;
        width: 2.5rem;
        height: 2.5rem;
        margin: max(0.75rem, env(safe-area-inset-top, 0px)) 0.75rem 0;
        border-radius: 0.5rem;
        background: rgba(255, 255, 255, 0.08);
      }
      [data-locale-neutral-shell]::after {
        flex: 1;
        min-width: 0;
        margin: 0.75rem;
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      html.light [data-locale-neutral-shell]::before {
        background: rgba(0, 0, 0, 0.08);
      }
      html.light [data-locale-neutral-shell]::after {
        background: #F7F8F7;
        border-color: rgba(0, 0, 0, 0.08);
      }
      @media (min-width: 1024px) {
        [data-locale-neutral-shell]::before {
          width: 5rem;
          height: auto;
          align-self: stretch;
          margin: 1rem 0.5rem;
          background: transparent;
        }
        html.light [data-locale-neutral-shell]::before {
          background: transparent;
        }
        [data-locale-neutral-shell]::after {
          margin: 1rem 1rem 1rem 0.25rem;
        }
      }
    </style>
    <title>StockPulse</title>
  </head>
  <body>
    <div id="root"><div data-locale-neutral-shell aria-busy="true" class="min-h-dvh bg-base"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
