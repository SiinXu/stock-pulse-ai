# One-shot: delete GitHub labels with zero issues and zero PRs.
# Dropped from the branch after a successful run.

name: Delete unused labels

permissions: {}

on:
  push:
    paths:
      - '.github/workflows/delete-unused-labels.yml'
  workflow_dispatch:

jobs:
  delete:
    name: Delete unused labels
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - name: Delete unused labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const names = [
              'auth',
              'community',
              'design-system',
              'integration',
              'knowledge',
              'pwa',
              'recommendation',
              'screening',
              'timeseries',
              'watchlist',
            ];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            for (const name of names) {
              try {
                await github.rest.issues.deleteLabel({ owner, repo, name });
                core.info(`deleted ${name}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`${name} already absent`);
                  continue;
                }
                throw error;
              }
            }
