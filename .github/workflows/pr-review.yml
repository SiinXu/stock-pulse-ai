# Automated pull request review with syntax checks and advisory AI reporting.
#
# Default-off for PR throughput: not in the main ruleset required checks and no longer
# auto-runs on pull_request. Maintainers opt in via workflow_dispatch with a required
# pr_number. The security-check job is checkout-free and reads PR metadata plus the
# changed-file inventory through the GitHub API only.
#
# Security model:
# - workflow_dispatch fails closed unless pr_number is a positive integer that identifies
#   an accessible pull request in this repository.
# - security-check is checkout-free. It snapshots head/base via pulls.get, inventories files
#   with SHA-pinned repos.compareCommits of those commits, re-gets, and fail-closes on
#   head/base drift before emitting outputs. pulls.listFiles cannot pin a SHA; a re-get
#   equality guard alone does not close B->A->B ABA. GitHub compare truncates at 300 files
#   and that case fail-closes. Downstream ai-review checkouts use the emitted SHAs with no
#   github.sha fallback.
# - Fork PRs: read-only static checks only. Repository secrets and write jobs are skipped.
# - Same-repo PRs targeting the default branch: static checks + AI review; write jobs stay
#   gated on pull_request and therefore remain idle on this dispatch-only trigger.
# - AI review runs trusted scripts from the PR base commit only; the PR tree is analysis data.
# - LLM secrets (GEMINI_API_KEY / OPENAI_API_KEY) are available only to the AI review step and
#   only on same-repo runs.
# - AI review is auxiliary: continue-on-error so a provider outage never blocks the PR.

name: PR Review

permissions: {}

on:
  # Opt-in only — do not auto-run on every PR (runner/cost contention with required CI).
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review (required positive integer)
        required: true
        type: string

# Avoid duplicate comments when the same pull request triggers multiple runs.
concurrency:
  group: pr-review-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ==================== Security check for sensitive file changes ====================
  security-check:
    name: 🔒 Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      safe_to_run: ${{ steps.snapshot.outputs.safe_to_run }}
      sensitive_files_changed: ${{ steps.snapshot.outputs.sensitive_files_changed }}
      is_fork: ${{ steps.snapshot.outputs.is_fork }}
      is_default_branch: ${{ steps.snapshot.outputs.is_default_branch }}
      base_sha: ${{ steps.snapshot.outputs.base_sha }}
      head_sha: ${{ steps.snapshot.outputs.head_sha }}
    
    steps:
      - name: 🔐 Snapshot Pull Request Trust And Inventory
        id: snapshot
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = process.env.PR_NUMBER || '';
            if (!/^[1-9][0-9]*$/.test(prNumber)) {
              core.setFailed('workflow_dispatch requires a positive integer pr_number');
              return;
            }
            const defaultBranch = process.env.DEFAULT_BRANCH || '';
            if (!defaultBranch) {
              core.setFailed('repository default branch is unavailable');
              return;
            }
            if (!context.payload.repository || context.payload.repository.id == null) {
              core.setFailed('repository metadata is unavailable');
              return;
            }
            const unsafeDynamicPattern = /[^\x00-\x7F]|&/gu;
            const escapeDynamicText = value => value.replace(unsafeDynamicPattern, character => {
              const codePoint = character.codePointAt(0);
              const hexadecimal = codePoint.toString(16).toUpperCase();
              return codePoint <= 0xFFFF
                ? `\\u${hexadecimal.padStart(4, '0')}`
                : `\\u{${hexadecimal}}`;
            });
            const missingMetadata = pull => !pull || !pull.head || !pull.head.repo || pull.head.repo.id == null || !pull.head.repo.owner || typeof pull.head.repo.owner.login !== 'string' || !pull.head.repo.owner.login || typeof pull.head.sha !== 'string' || !pull.head.sha || !pull.base || typeof pull.base.ref !== 'string' || !pull.base.ref || typeof pull.base.sha !== 'string' || !pull.base.sha;
            let firstPull;
            try {
              const firstResponse = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(prNumber),
              });
              firstPull = firstResponse.data;
            } catch (error) {
              const status = error.status || 'unknown';
              core.setFailed(`Unable to read pull request ${prNumber}: ${status}`);
              return;
            }
            if (missingMetadata(firstPull)) {
              core.setFailed(`Pull request ${prNumber} is missing head or base metadata`);
              return;
            }
            const comparisonHead = String(firstPull.head.repo.id) === String(context.payload.repository.id) ? firstPull.head.sha : `${firstPull.head.repo.owner.login}:${firstPull.head.sha}`;
            let files;
            try {
              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: firstPull.base.sha,
                head: comparisonHead,
              });
              files = comparison.data && comparison.data.files;
            } catch (error) {
              const status = error.status || 'unknown';
              core.setFailed(`Unable to compare pinned SHAs for pull request ${prNumber}: ${status}`);
              return;
            }
            if (!Array.isArray(files)) {
              core.setFailed(`Unable to compare pinned SHAs for pull request ${prNumber}: invalid response`);
              return;
            }
            if (files.length >= 300) {
              core.setFailed(`Unable to compare pinned SHAs for pull request ${prNumber}: file inventory is truncated`);
              return;
            }
            for (const file of files) {
              if (!file || typeof file.filename !== 'string' || !file.filename) {
                core.setFailed(`Unable to compare pinned SHAs for pull request ${prNumber}: a changed file is missing its filename`);
                return;
              }
            }
            let secondPull;
            try {
              const secondResponse = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(prNumber),
              });
              secondPull = secondResponse.data;
            } catch (error) {
              const status = error.status || 'unknown';
              core.setFailed(`Unable to read pull request ${prNumber}: ${status}`);
              return;
            }
            if (missingMetadata(secondPull)) {
              core.setFailed(`Pull request ${prNumber} is missing head or base metadata`);
              return;
            }
            if (firstPull.head.sha !== secondPull.head.sha || firstPull.base.sha !== secondPull.base.sha || firstPull.base.ref !== secondPull.base.ref || String(firstPull.head.repo.id) !== String(secondPull.head.repo.id)) {
              core.setFailed(`Pull request ${prNumber} changed during the API snapshot`);
              return;
            }
            const pull = secondPull;
            const isFork = String(pull.head.repo.id) !== String(context.payload.repository.id);
            const isDefaultBranch = pull.base.ref === defaultBranch;
            const sensitivePattern = /^(\.github\/workflows\/.*\.yml|\.github\/scripts\/.*\.py)$/;
            const sensitiveFiles = files
              .map(file => file.filename)
              .filter(filename => sensitivePattern.test(filename));
            core.setOutput('is_fork', isFork ? 'true' : 'false');
            core.setOutput('is_default_branch', isDefaultBranch ? 'true' : 'false');
            core.setOutput('base_sha', pull.base.sha);
            core.setOutput('head_sha', pull.head.sha);
            if (isFork) {
              core.summary.addRaw('## Fork Pull Request Policy\n\nThis run is limited to read-only static checks.\nAI review, automatic labels, and review comments are skipped because fork workflows do not receive repository secrets or write permissions.\n');
              await core.summary.write();
            }
            if (sensitiveFiles.length > 0) {
              const escaped = sensitiveFiles.map(escapeDynamicText).join('\n');
              core.summary.addRaw('⚠️ **Sensitive files changed; manual review is required.**\n\nChanged sensitive files:\n\n```\n');
              core.summary.addRaw(`${escaped}\n`);
              core.summary.addRaw('```\n\nThe change is flagged for focused manual review; automated checks will continue.\n');
              await core.summary.write();
              core.setOutput('sensitive_files_changed', 'true');
              core.setOutput('safe_to_run', 'true');
            } else {
              core.summary.addRaw('✅ No sensitive file changes detected\n');
              await core.summary.write();
              core.setOutput('sensitive_files_changed', 'false');
              core.setOutput('safe_to_run', 'true');
            }

  # ==================== Static checks before AI review ====================
  auto-check:
    name: 🔍 Static Checks
    runs-on: ubuntu-latest
    needs: [security-check]
    if: needs.security-check.outputs.safe_to_run == 'true'
    permissions:
      contents: read
    outputs:
      syntax_ok: ${{ steps.syntax.outputs.syntax_ok }}
      has_py_changes: ${{ steps.check_files.outputs.has_py_changes }}
      has_reviewable_changes: ${{ steps.check_files.outputs.has_reviewable_changes }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: 🔄 Fetch Base Branch
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
      
      - name: 🐍 Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            build-constraints.txt
            .github/requirements-review.txt
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade --build-constraint build-constraints.txt -r .github/requirements-review.txt
          python -m pip check
      
      - name: 📋 Identify Changed Files
        id: check_files
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "origin/$BASE_REF...HEAD" -- '*.py' 2>/dev/null || echo "")
          REVIEWABLE_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" -- '*.py' '*.md' 'docs/**' 'README.md' 'AGENTS.md' 'requirements.txt' '.github/requirements-ci.txt' 'pyproject.toml' 'setup.cfg' '.github/PULL_REQUEST_TEMPLATE.md' '.github/workflows/**' '.github/scripts/**' 2>/dev/null || echo "")

          if [ -z "$REVIEWABLE_FILES" ]; then
            echo "has_reviewable_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_reviewable_changes=true" >> $GITHUB_OUTPUT
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_py_changes=false" >> $GITHUB_OUTPUT
            echo "✅ No Python files changed" >> $GITHUB_STEP_SUMMARY
          else
            echo "has_py_changes=true" >> $GITHUB_OUTPUT
            echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV
            echo "$CHANGED_FILES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
      
      - name: 🐍 Check Python Syntax
        id: syntax
        if: steps.check_files.outputs.has_py_changes == 'true'
        run: |
          escape_dynamic_text() {
            perl -CSDA -pe 's/([^\x00-\x7F]|&)/sprintf("\\u{%X}", ord($1))/ge'
          }
          echo "## 🐍 Python Syntax Check" >> $GITHUB_STEP_SUMMARY
          echo "$CHANGED_FILES" | escape_dynamic_text | sed 's/^/Checking file: /'
          
          ERRORS=""
          SYNTAX_OK="true"
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              if ! COMPILE_OUTPUT=$(python -m py_compile "$file" 2>&1); then
                if [ -n "$COMPILE_OUTPUT" ]; then
                  printf '%s\n' "$COMPILE_OUTPUT" | escape_dynamic_text
                fi
                ERRORS="$ERRORS\n❌ Syntax error in $file"
                SYNTAX_OK="false"
              fi
            fi
          done
          
          echo "syntax_ok=$SYNTAX_OK" >> $GITHUB_OUTPUT
          
          if [ "$SYNTAX_OK" = "false" ]; then
            echo -e "$ERRORS" | escape_dynamic_text >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All changed Python files have valid syntax" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: 🔎 Check Critical Flake8 Errors
        if: steps.check_files.outputs.has_py_changes == 'true'
        run: |
          escape_dynamic_text() {
            perl -CSDA -pe 's/([^\x00-\x7F]|&)/sprintf("\\u{%X}", ord($1))/ge'
          }
          echo "## 🔎 Code Quality Check" >> $GITHUB_STEP_SUMMARY
          RESULT=$(flake8 $CHANGED_FILES --select=E9,F63,F7,F82 --format='%(path)s:%(row)d: %(code)s %(text)s' 2>/dev/null || true)
          if [ -n "$RESULT" ]; then
            echo "⚠️ The following critical issues were found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$RESULT" | escape_dynamic_text >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No critical Flake8 issues found" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: 📊 Summarize Changes
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          escape_dynamic_text() {
            perl -CSDA -pe 's/([^\x00-\x7F]|&)/sprintf("\\u{%X}", ord($1))/ge'
          }
          echo "## 📊 Change Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          STATS=$(git diff --stat "origin/$BASE_REF...HEAD" 2>/dev/null | tail -1)
          echo "$STATS" | escape_dynamic_text >> $GITHUB_STEP_SUMMARY

      - name: 📏 PR Size Advisory
        id: size_advisory
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          SIZE_ADVISORY_THRESHOLD: "1000"
        run: |
          escape_dynamic_text() {
            perl -CSDA -pe 's/([^\x00-\x7F]|&)/sprintf("\\u{%X}", ord($1))/ge'
          }
          # Count changed lines excluding lockfiles and common generated artifacts.
          # Advisory only: never fails the job.
          EXCLUDE_REGEX='(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Cargo\.lock|poetry\.lock|Pipfile\.lock|composer\.lock|constraints\.txt|build-constraints\.txt|.*\.generated\.(ts|js|json)|openapi\.json|.*\.min\.(js|css))$'
          TOTAL=0
          while IFS=$'\t' read -r added deleted path; do
            [ -z "$path" ] && continue
            if printf '%s\n' "$path" | grep -Eq "$EXCLUDE_REGEX"; then
              continue
            fi
            case "$added" in (*[!0-9]*) added=0 ;; esac
            case "$deleted" in (*[!0-9]*) deleted=0 ;; esac
            TOTAL=$((TOTAL + added + deleted))
          done < <(git diff --numstat "origin/$BASE_REF...HEAD" 2>/dev/null || true)

          echo "advisory_lines=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "## 📏 PR Size Advisory" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reviewable changed lines (excluding lockfiles/generated): **${TOTAL}** (threshold: ${SIZE_ADVISORY_THRESHOLD})" | escape_dynamic_text >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -gt "$SIZE_ADVISORY_THRESHOLD" ]; then
            echo "size_advisory=true" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "This pull request exceeds ~${SIZE_ADVISORY_THRESHOLD} changed lines after excluding lockfiles and generated files."
              echo ""
              echo "Per AGENTS.md section 1.2, large diffs that stack volume instead of converging a clear contract are discouraged. Please either:"
              echo "1. Split into smaller, reviewable pull requests, or"
              echo "2. Document in the PR body why this scope cannot be split (single atomic contract, mechanical rename, generated bulk with a thin real change, etc.)."
              echo ""
              echo "This notice is advisory only and does not block merge."
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo "### 📏 PR Size Advisory"
              echo ""
              echo "This pull request changes **${TOTAL}** lines (excluding lockfiles and generated files), which exceeds the ~${SIZE_ADVISORY_THRESHOLD}-line advisory threshold."
              echo ""
              echo "Per AGENTS.md section 1.2, prefer splitting large work or explain in the PR body why the scope must stay together. This notice is advisory only and does not block merge."
            } > "${RUNNER_TEMP}/size_advisory.txt"
          else
            echo "size_advisory=false" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Within the advisory size threshold." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📤 Upload Size Advisory Note
        if: steps.size_advisory.outputs.size_advisory == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-advisory
          path: ${{ runner.temp }}/size_advisory.txt
          if-no-files-found: ignore

  # ==================== AI review (same-repo, default-branch target only) ====================
  ai-review:
    name: 🤖 AI Code Review
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [security-check, auto-check]
    if: |
      needs.security-check.outputs.safe_to_run == 'true' &&
      needs.security-check.outputs.is_fork != 'true' &&
      needs.security-check.outputs.is_default_branch == 'true' &&
      needs.auto-check.result == 'success' &&
      needs.auto-check.outputs.has_reviewable_changes == 'true'
    permissions:
      contents: read
    
    steps:
      # Pin trusted review inputs to the pull request base commit.
      - name: 📥 Checkout Trusted Review Inputs
        id: trusted-review-inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security-check.outputs.base_sha }}
          sparse-checkout: |
            .github/scripts
            .github/requirements-review.txt
            constraints.txt
            build-constraints.txt
          sparse-checkout-cone-mode: false
          path: main-scripts
      
      # Check out the pull request code separately for diff analysis.
      - name: 📥 Checkout Pull Request Code
        id: pull-request-analysis-inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security-check.outputs.head_sha }}
          fetch-depth: 0
          path: pr-code
      
      - name: 🔄 Fetch Base Branch
        id: fetch-analysis-base
        working-directory: pr-code
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
      
      - name: 🐍 Set Up Python
        id: setup-review-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      
      - name: 📦 Install Dependencies
        id: install-trusted-review-dependencies
        run: |
          python -m pip install --upgrade --constraint main-scripts/constraints.txt pip
          python -m pip install --build-constraint main-scripts/build-constraints.txt -r main-scripts/.github/requirements-review.txt
          python -m pip check
      
      - name: 🤖 Review Changes with AI
        id: run-ai-review
        working-directory: pr-code
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || 'gemini-2.5-flash' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          AI_REVIEW_STRICT: ${{ vars.AI_REVIEW_STRICT || 'false' }}
          CI_SYNTAX_OK: ${{ needs.auto-check.outputs.syntax_ok || '' }}
          CI_HAS_PY_CHANGES: ${{ needs.auto-check.outputs.has_py_changes || 'false' }}
          CI_AUTO_CHECK_RESULT: ${{ needs.auto-check.result || '' }}
        run: |
          set -euo pipefail
          trusted_output="${RUNNER_TEMP}/ai_review_result.txt"
          rm -rf -- "${trusted_output}" ai_review_result.txt
          python ../main-scripts/.github/scripts/ai_review.py
          if [[ -e ai_review_result.txt || -L ai_review_result.txt ]]; then
            if [[ ! -f ai_review_result.txt || -L ai_review_result.txt ]]; then
              echo "AI review output must be a regular file"
              exit 1
            fi
            mv -- ai_review_result.txt "${trusted_output}"
          fi
      
      - name: 📤 Upload Review Result
        id: upload-ai-review-result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ai-review-result
          path: ${{ runner.temp }}/ai_review_result.txt
          if-no-files-found: ignore

  # ==================== Automatic pull request labels ====================
  labeler:
    name: 🏷️ Automatic Labels
    runs-on: ubuntu-latest
    needs: [security-check]
    if: |
      github.event_name == 'pull_request' &&
      needs.security-check.outputs.is_fork != 'true' &&
      needs.security-check.outputs.is_default_branch == 'true'
    permissions:
      pull-requests: write
    
    steps:
      - name: 🏷️ Add Labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            
            const labels = new Set();
            
            for (const file of files) {
              const filename = file.filename.toLowerCase();
              
              if (filename.includes('notification') || filename.includes('webhook')) {
                labels.add('notification');
              }
              if (filename.includes('feishu')) {
                labels.add('feishu');
              }
              if (filename.includes('data_provider') || filename.includes('fetcher')) {
                labels.add('data-source');
              }
              if (filename.includes('analyzer') || filename.includes('ai')) {
                labels.add('ai');
              }
              if (filename.endsWith('.md') || filename.includes('doc')) {
                labels.add('documentation');
              }
              if (filename.includes('workflow') || filename.includes('.github')) {
                labels.add('ci');
              }
              if (filename.includes('config')) {
                labels.add('config');
              }
              if (filename.includes('test')) {
                labels.add('testing');
              }
            }
            
            const additions = files.reduce((sum, f) => sum + f.additions, 0);
            const deletions = files.reduce((sum, f) => sum + f.deletions, 0);
            const totalChanges = additions + deletions;
            
            if (totalChanges < 50) {
              labels.add('size/S');
            } else if (totalChanges < 200) {
              labels.add('size/M');
            } else if (totalChanges < 500) {
              labels.add('size/L');
            } else {
              labels.add('size/XL');
            }
            
            if (labels.size > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: Array.from(labels)
                });
                console.log(`Added labels: ${Array.from(labels).join(', ')}`);
              } catch (e) {
                console.log(`Failed to add labels: ${e.message}`);
              }
            }

  # ==================== Automated review comment ====================
  comment:
    name: 💬 Review Report
    runs-on: ubuntu-latest
    needs: [security-check, auto-check, ai-review]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.security-check.outputs.safe_to_run == 'true' &&
      needs.security-check.outputs.is_fork != 'true' &&
      needs.security-check.outputs.is_default_branch == 'true'
    permissions:
      pull-requests: write
    
    steps:
      - name: 📥 Download AI Review Result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.ai-review.result == 'success'
        continue-on-error: true
        with:
          name: ai-review-result
          path: .

      - name: 📥 Download Size Advisory Note
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: size-advisory
          path: .
      
      - name: 💬 Publish Review Report
        env:
          AUTO_CHECK_RESULT: ${{ needs.auto-check.result }}
          AI_REVIEW_RESULT: ${{ needs.ai-review.result }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            
            const additions = files.reduce((sum, f) => sum + f.additions, 0);
            const deletions = files.reduce((sum, f) => sum + f.deletions, 0);
            const changedFiles = files.length;
            const unsafeDynamicPattern = /[^\x00-\x7F]|&/gu;
            const escapeDynamicText = value => value.replace(unsafeDynamicPattern, character => {
              const codePoint = character.codePointAt(0);
              const hexadecimal = codePoint.toString(16).toUpperCase();
              return codePoint <= 0xFFFF
                ? `\\u${hexadecimal.padStart(4, '0')}`
                : `\\u{${hexadecimal}}`;
            });
            const containsNonEnglishLetter = value => Array.from(value).some(character =>
              /\p{L}/u.test(character) && !/[A-Za-z]/.test(character)
            );
            const characterReferencePattern = /&(?:#[xX][0-9A-Fa-f]+|#\d+|[A-Za-z][A-Za-z0-9]+);/u;
            const containsCharacterReference = value => characterReferencePattern.test(value);
            
            let aiReview = '';
            try {
              aiReview = fs.readFileSync('ai_review_result.txt', 'utf8');
            } catch (e) {
              console.log('No AI review result found');
            }
            if (containsNonEnglishLetter(aiReview)) {
              console.log('AI review artifact omitted because it contains non-English letters');
              aiReview = '';
            }
            if (containsCharacterReference(aiReview)) {
              console.log('AI review artifact omitted because it contains an HTML character reference');
              aiReview = '';
            }

            let sizeAdvisory = '';
            try {
              sizeAdvisory = fs.readFileSync('size_advisory.txt', 'utf8');
            } catch (e) {
              console.log('No size advisory note found');
            }
            if (containsNonEnglishLetter(sizeAdvisory) || containsCharacterReference(sizeAdvisory)) {
              console.log('Size advisory omitted because it failed the English-only guard');
              sizeAdvisory = '';
            }
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && 
              c.body.includes('## 🤖 Automated Review Report')
            );
            
            const checkStatus = process.env.AUTO_CHECK_RESULT === 'success' ? '✅ Passed' : '⚠️ Issues found';
            const aiStatus = aiReview ? '✅ Completed' :
                            process.env.AI_REVIEW_RESULT === 'skipped' ? '⏭️ Skipped' :
                            process.env.AI_REVIEW_RESULT === 'success' ? '⏭️ No publishable result' : '⚠️ Failed';
            
            let report = `## 🤖 Automated Review Report

            | Check | Result |
            |------|------|
            | 📊 Changed files | ${changedFiles} |
            | ➕ Added lines | ${additions} |
            | ➖ Deleted lines | ${deletions} |
            | 🔍 Static checks | ${checkStatus} |
            | 🧠 AI review | ${aiStatus} |

            ### 📁 Changed Files

            `;
            
            for (const file of files.slice(0, 20)) {
              const status = file.status === 'added' ? '🆕' : 
                            file.status === 'removed' ? '🗑️' : '📝';
              const displayFilename = escapeDynamicText(file.filename);
              report += `- ${status} \`${displayFilename}\` (+${file.additions}/-${file.deletions})\n`;
            }
            
            if (files.length > 20) {
              report += `\n... and ${files.length - 20} more files\n`;
            }

            if (sizeAdvisory) {
              report += `
            ---

            ${sizeAdvisory}
            `;
            }
            
            if (aiReview) {
              report += `
            ---

            ### 🧠 AI Code Review

            ${aiReview}
            `;
            }
            
            report += `
            ---

            > 💡 **Reminder:** Make sure the code passes the relevant local tests and follows the repository standards. Automated review is advisory and non-blocking.
            `;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }
