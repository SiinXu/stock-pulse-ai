        run: npm ci
      - name: 🔎 Lint
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        run: npm run lint
      - name: 🌐 i18n guards
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        run: npm run test:i18n
      - name: 🧪 Unit tests
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        run: npm run test:coverage
      # Per-scenario gates: blocking fails, observe warns, skip is unavailable (Issue #883 / T26).
      - name: ⏱ Runtime performance budgets
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        working-directory: apps/dsa-web
        run: node scripts/check-runtime-performance.mjs --print --warmup 1 --repeat 3
      - name: 🏗️ Build
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        run: npm run build
      - name: 📦 Bundle size budget
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        run: node scripts/check-bundle-size.mjs --print

  desktop-gate:
    name: desktop-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, ai-governance]
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/dsa-desktop
    steps:
      - name: 🔒 Validate desktop-gate prerequisites
        if: >-
          ${{ always() &&
          (needs.ai-governance.result != 'success' ||
          needs.changes.result != 'success' ||
          (needs.changes.outputs.desktop != 'true' &&
          needs.changes.outputs.desktop != 'false')) }}
        working-directory: .
        run: |
          {
            echo "## Desktop gate"
            echo ""
            echo "A required prerequisite failed or desktop change detection returned an unavailable result, so desktop-gate fails closed."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: No desktop changes
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.desktop == 'false' }}
        working-directory: .
        run: |
          {
            echo "## Desktop gate"
            echo ""
            echo "No desktop changes were detected. The desktop unit-test matrix was not required."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 📥 Checkout
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.desktop == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🟢 Setup Node
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.desktop == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/dsa-desktop/package-lock.json
      - name: 📦 Install
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.desktop == 'true' }}
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: 🧪 Unit tests
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.desktop == 'true' }}
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm test

  # Observation only: not in the main ruleset required checks. Skip on pull_request
  # so PR throughput stays on the blocking gate; still run on push-to-main when paths match.
  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, ai-governance]
    if: github.event_name == 'push' && needs.changes.outputs.web_e2e == 'true'
    permissions:
      contents: read
    env:
      DSA_PLAYWRIGHT_ARTIFACT_CANARY: stockpulse-playwright-canary-7f91c2a6b43d
      DSA_WEB_E2E_RUN_ID: ci-secret-bearing
      DSA_WEB_E2E_CREDENTIAL_BEARING: "true"
      DSA_WEB_E2E_TRACE: "off"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install backend dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 🟢 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: 📦 Install frontend dependencies
        working-directory: apps/dsa-web
        run: npm ci
      - name: 🔒 Playwright credential safety preflight
        working-directory: apps/dsa-web
        run: npm run test:e2e-security-preflight
      - name: 🎭 Install Playwright browsers
        working-directory: apps/dsa-web
        run: npx playwright install --with-deps chromium
      - name: 🎭 Playwright e2e (including i18n acceptance)
        working-directory: apps/dsa-web
        env:
          # First-run password for Playwright's isolated ENV_FILE; not a real
          # credential and never written to the repository .env.
          DSA_WEB_SMOKE_PASSWORD: dsa-ci-smoke
          # Seeded through native fetch outside Playwright tracing; browser
          # config responses contain only the application's mask token.
          DSA_WEB_E2E_ALPHA_API_KEY: ${{ env.DSA_PLAYWRIGHT_ARTIFACT_CANARY }}
        run: npm run test:smoke
      - name: 🔐 Scan Playwright artifacts for secrets
        id: artifact_scan
        if: always()
        run: python scripts/scan_playwright_artifacts.py "apps/dsa-web/test-results/${DSA_WEB_E2E_RUN_ID}/"
      - name: 📦 Stage allowlisted Playwright diagnostics
        id: artifact_stage
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        env:
          SOURCE_DIR: apps/dsa-web/test-results/${{ env.DSA_WEB_E2E_RUN_ID }}
          STAGING_DIR: ${{ runner.temp }}/playwright-upload
        run: python scripts/stage_playwright_diagnostics.py "${SOURCE_DIR}" "${STAGING_DIR}"
      - name: 🔐 Scan staged Playwright diagnostics
        id: staged_artifact_scan
        if: ${{ always() && steps.artifact_scan.outcome == 'success' && steps.artifact_stage.outcome == 'success' }}
        run: python scripts/scan_playwright_artifacts.py "${{ runner.temp }}/playwright-upload/"
      - name: 📤 Upload scanned Playwright diagnostics
        if: ${{ always() && steps.artifact_scan.outcome == 'success' && steps.artifact_stage.outcome == 'success' && steps.staged_artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: ${{ runner.temp }}/playwright-upload/
          if-no-files-found: error
          retention-days: 7

  # Non-required: exercise tests/api against the real Starlette TestClient.
  # Default offline suite keeps STOCKPULSE_TEST_THREADLESS=1 (threadless client).
  # Observation only — run on push-to-main, not on pull_request.
  api-real-client:
    name: api-real-client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ai-governance]
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 🧪 API suite with real Starlette TestClient
        env:
          STOCKPULSE_TEST_THREADLESS: '0'
        run: |
          test_data_dir="$(mktemp -d)"
          set +e
          DATABASE_PATH="${test_data_dir}/stockpulse-ci.sqlite" \
            python -m pytest tests/api -m "not network and not benchmark" -rs \
            > /tmp/api_real_client_pytest.log 2>&1
          status=$?
          set -e
          cat /tmp/api_real_client_pytest.log
          rm -rf "${test_data_dir}"
          exit "${status}"
