name: CI

permissions: {}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PRs share a group by PR number; pushes to main share ci-refs/heads/main.
# cancel-in-progress drops superseded runs (merge-burst on main or force-push-like
# rapid PR updates) so only the newest revision keeps consuming runners.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 🔎 Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Backend suite when non-web paths change, or when web paths that are
      # shared runtime/config contracts change (provider templates, help copy,
      # public assets consumed outside the SPA).
      backend: ${{ steps.backend-filter.outputs.backend_non_web == 'true' || steps.filter.outputs.backend_web_contract == 'true' }}
      # Fail closed to the sharded full suite when the planner did not write
      # an explicit false. Empty output must not schedule the 45-minute
      # selective job, which cannot run the unsharded offline suite in time.
      backend_full: ${{ steps.backend-selection.outputs.full || 'true' }}
      docker: ${{ steps.filter.outputs.docker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      web_e2e: ${{ steps.filter.outputs.web_e2e }}
      ocr_extractor: ${{ steps.filter.outputs.ocr_extractor }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR test planner needs the merge base to distinguish FULL from
          # selective coverage before backend jobs are scheduled.
          fetch-depth: 0
      - name: 🧭 Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Shared web/runtime contracts that still require backend validation.
            backend_web_contract:
              - 'apps/dsa-web/public/**'
              - 'apps/dsa-web/src/components/settings/llmProviderTemplates.ts'
              - 'apps/dsa-web/src/locales/settingsHelp.ts'
              - 'apps/dsa-web/src/locales/settingsHelp.en.ts'
              - 'apps/dsa-web/src/locales/settingsHelp.zh.ts'
              - 'apps/dsa-web/src/utils/systemConfigI18n.ts'
            docker:
              - '*.py'
              - 'src/**'
              - 'strategies/**'
              - 'apps/dsa-web/**'
              - 'docker/**'
              - 'requirements.txt'
              - 'constraints.txt'
              - 'build-constraints.txt'
              - 'pyproject.toml'
              - 'README.md'
              - 'LICENSE'
              - '.github/requirements-ci.txt'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            # web-gate only: frontend lint/unit/build (genuinely frontend-only)
            frontend:
              - 'apps/dsa-web/**'
            # web-e2e boots a real backend; re-run when the stack it imports changes
            web_e2e:
              - 'apps/dsa-web/**'
              - 'src/**'
              - 'main.py'
              - 'server.py'
              - 'requirements.txt'
              - '.github/requirements-ci.txt'
              - '.github/workflows/ci.yml'
            # ocr-stock-extractor: optional Tesseract stack + image stock extractor
            ocr_extractor:
              - 'src/services/image_stock_extractor.py'
              - 'src/services/ocr_extraction_service.py'
              - 'src/agent/tools/ocr_tools.py'
              - 'src/plugins/builtin/ocr.py'
              - 'src/api/v1/endpoints/stocks.py'
              - 'tests/services/test_image_stock_extractor_contract.py'
              - 'tests/services/test_image_stock_extractor_litellm.py'
              - 'tests/services/test_ocr_extraction_service.py'
              - 'tests/agent/tools/test_ocr_tools.py'
              - 'tests/agent/tools/test_ocr_tool_surface_runtime.py'
              - 'tests/config/test_ocr_config.py'
              - 'tests/plugins/test_ocr_agent_tool.py'
              - 'tests/fixtures/ocr/**'
              - 'tests/fixtures/multimodal/sample_financial_report.pdf'
              - 'requirements-ocr.txt'
              - '.github/workflows/ci.yml'
            # desktop-gate: Electron unit tests (not packaging / network download)
            desktop:
              - 'apps/dsa-desktop/**'
              - 'scripts/run-desktop.ps1'
              - 'scripts/build-desktop*.ps1'
              - 'scripts/build-desktop*.sh'
              - 'scripts/build-all.ps1'
              - 'scripts/build-all-macos.sh'
              - 'scripts/build-backend.ps1'
              - 'scripts/build-backend-macos.sh'
              - 'scripts/verify-desktop-updater-artifacts.ps1'
              - 'scripts/prepare-embedded-ollama.js'
              - 'requirements-desktop.txt'
              - 'THIRD_PARTY_NOTICES'
              - '.github/workflows/desktop-release.yml'
              - '.github/workflows/ci.yml'
      - name: 🧭 Filter backend-safe frontend paths
        id: backend-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # true when any changed path is outside apps/dsa-web/**
          predicate-quantifier: every
          filters: |
            backend_non_web:
              - '**'
              - '!apps/dsa-web/**'
              - '!docs/CHANGELOG.md'
              - '!docs/changelog.d/**'
      - name: 🧪 Plan PR backend test tier
        id: backend-selection
        if: >-
          github.event_name == 'pull_request' &&
          (steps.backend-filter.outputs.backend_non_web == 'true' ||
           steps.filter.outputs.backend_web_contract == 'true')
        env:
          # Pin the PR event base SHA. Fetching origin/main --depth=1 after
          # checkout can move the ref to a newer main tip and drop merge-base,
          # so the later 45-minute job remaps NONE → FULL (PRs #1375/#1377).
          CI_SELECT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          selection="$(python scripts/ci_select_tests.py --base "${CI_SELECT_BASE}")"
          if [ "${selection}" = "FULL" ]; then
            echo "full=true" >> "${GITHUB_OUTPUT}"
          else
            echo "full=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "Backend test selection: ${selection}"

  ai-governance:
    name: ai-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: 🤖 Check AI governance assets
        run: python scripts/check_ai_assets.py
      - name: 🧾 Validate changelog fragments
        run: python scripts/collect_changelog.py --check
      - name: 🧾 Require changelog entry for product-code PRs
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python scripts/collect_changelog.py --require-entry --base "origin/${{ github.base_ref }}"

  agent-eval-gate:
    name: agent-eval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, ai-governance]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: Offline agent + prediction eval regression gate
        # Blocking gate for Issues #1092 / #1107. Threshold is fixed at 0.0 on
        # deterministic frozen fixtures — do not relax to keep CI green.
        run: |
          set -o pipefail
          test_data_dir="$(mktemp -d)"
          DATABASE_PATH="${test_data_dir}/stockpulse-agent-eval.sqlite" \
            python scripts/run_agent_benchmark.py --strict-baseline
          DATABASE_PATH="${test_data_dir}/stockpulse-agent-eval.sqlite" \
            python -m pytest -m "not network and not benchmark" \
              tests/services/test_prediction_eval_service.py \
              tests/agent/benchmark/test_regression_gate.py \
              tests/services/test_agent_episode_service.py \
              -q --tb=short
          rm -rf "${test_data_dir}"

  # ---------------------------------------------------------------------------
  # PR tier: fast backend-gate for selective pytest. FULL selections use the
  # 30-minute backend-tests shards and summary job below — never the unsharded
  # offline_test_suite inside this 45-minute job. Required check name:
  # backend-gate.
  # ---------------------------------------------------------------------------
  backend-gate:
    name: backend-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, ai-governance]
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true' && needs.changes.outputs.backend_full != 'true'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Selective offline tests pin github.event.pull_request.base.sha.
          fetch-depth: 0
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 🔐 Verify dependency supply chain
        run: |
          python scripts/check_dependency_locks.py --verify-generated
          python scripts/check_dependency_vulnerabilities.py --self-test
          python scripts/check_dependency_vulnerabilities.py
      - name: 🧭 Native runtime isolation (no PydanticAI)
        run: |
          python -c "
          import importlib.util
          assert importlib.util.find_spec('pydantic_ai') is None, \
              'pydantic_ai must not be present in the native gate'
          from src.agent.runtime.pydantic_ai_adapter import is_pydantic_ai_available
          assert is_pydantic_ai_available() is False
          from src.agent import factory  # native factory imports without pydantic-ai
          from src.agent.runtime.native_adapter import NativeRuntimeAdapter  # noqa: F401
          from src.agent.runtime.contract import ExecutionContext  # noqa: F401
          print('✅ native gate has no pydantic-ai dependency')
          "
      - name: ✅ Python syntax check
        run: ./scripts/ci_gate.sh syntax
      - name: ✅ Flake8 critical checks
        run: ./scripts/ci_gate.sh flake8
      - name: ✅ Local deterministic checks
        run: ./scripts/ci_gate.sh deterministic
      - name: 🧪 Enforce offline Agent prediction eval baseline
        env:
          DATABASE_PATH: ${{ runner.temp }}/stockpulse-agent-eval.sqlite
        run: python scripts/run_agent_benchmark.py --strict-baseline --quiet
      - name: ✅ Selective offline tests (PR tier)
        env:
          # Same pinned PR base as the planner. Do not fetch origin/main
          # with --depth=1: that remapped planner NONE to FULL and ran the
          # unsharded suite until the 45-minute cap cancelled the job
          # (PR #1375 run 32238883191, PR #1377 run 32238746609).
          CI_SELECT_BASE: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/ci_gate.sh offline-tests-selective

  # ---------------------------------------------------------------------------
  # Full-suite tier: sharded offline suite for push-to-main and PRs whose path
  # mapping fails closed to FULL. Coverage floor runs once after combine.
  # ---------------------------------------------------------------------------
  backend-tests:
    name: backend-tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, ai-governance]
    if: needs.changes.outputs.backend == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.backend_full == 'true'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trailer tests walk git log. Default depth 1 only sees the squash
          # HEAD message, so ancestor Ported-from trailers vanish after landing
          # (push run 32414632111). Full history is required; it does not
          # fetch origin/main with --depth=1.
          fetch-depth: 0
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 🔐 Verify dependency supply chain
        if: matrix.shard == 1
        run: |
          python scripts/check_dependency_locks.py --verify-generated
          python scripts/check_dependency_vulnerabilities.py --self-test
          python scripts/check_dependency_vulnerabilities.py
      - name: 🧭 Native runtime isolation (no PydanticAI)
        if: matrix.shard == 1
        run: |
          python -c "
          import importlib.util
          assert importlib.util.find_spec('pydantic_ai') is None, \
              'pydantic_ai must not be present in the native gate'
          from src.agent.runtime.pydantic_ai_adapter import is_pydantic_ai_available
          assert is_pydantic_ai_available() is False
          print('✅ native gate has no pydantic-ai dependency')
          "
      - name: ✅ Python syntax check
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh syntax
      - name: ✅ Flake8 critical checks
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh flake8
      - name: ✅ Local deterministic checks
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh deterministic
      - name: ✅ Offline test suite shard ${{ matrix.shard }}/4
        env:
          PYTEST_SPLITS: '4'
          PYTEST_GROUP: ${{ matrix.shard }}
          PYTEST_FIRST_SHARD_OVERHEAD: '30'
          COVERAGE_SHARD_DIR: ${{ runner.temp }}/cov
        run: |
          mkdir -p "${COVERAGE_SHARD_DIR}"
          ./scripts/ci_gate.sh offline-tests-shard
      - name: 📤 Upload shard coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/cov/.coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  backend-gate-main:
    name: backend-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, ai-governance, backend-tests]
    if: always() && needs.changes.outputs.backend == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.backend_full == 'true'))
    permissions:
      contents: read
    steps:
      - name: ✅ Require shard success
        env:
          AI_RESULT: ${{ needs.ai-governance.result }}
          TESTS_RESULT: ${{ needs.backend-tests.result }}
        run: |
          set -euo pipefail
          if [ "${AI_RESULT}" != "success" ]; then
            echo "ai-governance failed: ${AI_RESULT}" >&2
            exit 1
          fi
          if [ "${TESTS_RESULT}" != "success" ]; then
            echo "backend-tests shards failed: ${TESTS_RESULT}" >&2
            exit 1
          fi
          echo "all backend shards passed"
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt
          python -m pip check
      - name: 🧪 Enforce offline Agent prediction eval baseline
        env:
          DATABASE_PATH: ${{ runner.temp }}/stockpulse-agent-eval.sqlite
        run: python scripts/run_agent_benchmark.py --strict-baseline --quiet
      - name: 📥 Download shard coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/cov-in
          pattern: coverage-shard-*
          merge-multiple: true
      - name: ✅ Combine coverage + floor
        env:
          COVERAGE_SHARD_DIR: ${{ runner.temp }}/cov-in
        run: ./scripts/ci_gate.sh offline-tests-combine

  # PR tier: 3.10 smoke (not a second full suite). Push-to-main: sharded full
  # offline suite on 3.10 so the floor runtime stays real without a 45–50 min
  # unsharded job that merge-burst cancel-in-progress routinely supersedes.
  # Required check *name* remains python-minimum. Coverage floor stays on the
  # Python 3.11 backend-gate combine; these shards only prove 3.10 execution.
  #
  # Job bound is 45 minutes, not the 3.11 backend-tests 30-minute bound.
  # Module-level shard 2 on 3.10 is ~28-30 min (AST-heavy exception-log
  # callsite scan); hosted run 32269161288 job 96121339880 cancelled at
  # 30:24 while still passing tests at 99%. Prior post-#1378 main runs
  # finished that shard in 29:24-29:52. This is headroom for 3.10 cost,
  # not a return to the unsharded 60-minute python-minimum job.
  python-minimum-tests:
    name: python-minimum-tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, ai-governance]
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'push'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same trailer-history contract as backend-tests: depth 1 drops
          # ancestor squash Ported-from trailers (push run 32414632111).
          fetch-depth: 0
      - name: 🐍 Setup minimum Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: ✅ Minimum Python offline suite shard ${{ matrix.shard }}/4
        env:
          PYTEST_SPLITS: '4'
          PYTEST_GROUP: ${{ matrix.shard }}
          PYTEST_FIRST_SHARD_OVERHEAD: '0'
          COVERAGE_SHARD_DIR: ${{ runner.temp }}/cov
        run: |
          mkdir -p "${COVERAGE_SHARD_DIR}"
          ./scripts/ci_gate.sh offline-tests-shard

  python-minimum:
    name: python-minimum
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, ai-governance, python-minimum-tests]
    if: always() && needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    steps:
      - name: ✅ Require python-minimum prerequisites
        env:
          AI_RESULT: ${{ needs.ai-governance.result }}
          TESTS_RESULT: ${{ needs.python-minimum-tests.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${AI_RESULT}" != "success" ]; then
            echo "ai-governance failed: ${AI_RESULT}" >&2
            exit 1
          fi
          if [ "${EVENT_NAME}" = "push" ]; then
            if [ "${TESTS_RESULT}" != "success" ]; then
              echo "python-minimum-tests shards failed: ${TESTS_RESULT}" >&2
              exit 1
            fi
            echo "all python-minimum shards passed"
          else
            echo "PR tier: python-minimum-tests skipped; smoke follows"
          fi
      - name: 📥 Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup minimum Python
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: ✅ Minimum Python smoke (PR tier)
        if: github.event_name == 'pull_request'
        run: ./scripts/ci_gate.sh python-min-smoke

  pydanticai-installed:
    name: pydanticai-installed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ai-governance]
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
