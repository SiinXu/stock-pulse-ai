          (needs.ai-governance.result != 'success' ||
          needs.changes.result != 'success' ||
          (needs.changes.outputs.ocr_extractor != 'true' &&
          needs.changes.outputs.ocr_extractor != 'false')) }}
        run: |
          {
            echo "## OCR stock extractor gate"
            echo ""
            echo "A required prerequisite failed or OCR change detection returned an unavailable result, so ocr-stock-extractor fails closed."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: No OCR extractor changes
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.ocr_extractor == 'false' }}
        run: |
          {
            echo "## OCR stock extractor gate"
            echo ""
            echo "No OCR stock-extractor changes were detected. The optional Tesseract matrix was not required."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 📥 Checkout
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.ocr_extractor == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.ocr_extractor == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
            requirements-ocr.txt
      - name: 🔤 Install Tesseract OCR engine
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.ocr_extractor == 'true' }}
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu images use mirror+file:/etc/apt/apt-mirrors.txt
          # with azure.archive.ubuntu.com first and archive.ubuntu.com next.
          # A degraded Azure front-end can ignore indexes until a long wrapper
          # fires; keep apt-native timeouts short and retry once against the
          # runner's already-listed public archive. Do not hide missing Tesseract.
          apt_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
          )
          apt_mirrors="/etc/apt/apt-mirrors.txt"

          prefer_runner_public_archive() {
            if [ ! -f "${apt_mirrors}" ]; then
              echo "GitHub runner apt mirror list ${apt_mirrors} is absent; retrying with apt-native timeouts only."
              return 0
            fi
            tmp="$(mktemp)"
            awk '!/azure[.]archive[.]ubuntu[.]com/' "${apt_mirrors}" > "${tmp}"
            if [ ! -s "${tmp}" ]; then
              rm -f "${tmp}"
              echo "::error::Runner apt mirror list has no non-Azure fallback URI." >&2
              return 1
            fi
            sudo cp "${tmp}" "${apt_mirrors}"
            rm -f "${tmp}"
            echo "Preferred the runner public Ubuntu archive fallback in ${apt_mirrors}."
          }

          install_tesseract() {
            sudo timeout --kill-after=10s 90s apt-get "${apt_options[@]}" update \
              && sudo timeout --kill-after=10s 120s apt-get "${apt_options[@]}" install \
                -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          }
          if ! install_tesseract; then
            prefer_runner_public_archive
            sudo rm -rf /var/lib/apt/lists/partial
            if ! install_tesseract; then
              echo "::error::Tesseract installation failed after one bounded Azure-mirror attempt and one public-archive fallback." >&2
              exit 1
            fi
          fi
          command -v tesseract >/dev/null
          tesseract --version
      - name: 📦 Install dependencies (native + optional OCR)
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.ocr_extractor == 'true' }}
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt \
              -r .github/requirements-ci.txt \
              -r requirements-ocr.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 🔎 Assert OCR imports
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.ocr_extractor == 'true' }}
        run: |
          python -c "
          import importlib.metadata as metadata
          import PIL  # noqa: F401
          import pytesseract  # noqa: F401
          from src.services.image_stock_extractor import extract_stock_codes_from_image  # noqa: F401
          from src.services.ocr_extraction_service import assess_ocr_dependencies
          report = assess_ocr_dependencies()
          assert report['ready'] is True, report
          print('Pillow', metadata.version('Pillow'))
          print('pytesseract', metadata.version('pytesseract'))
          print('tesseract', pytesseract.get_tesseract_version())
          print('✅ OCR optional stack importable in the installed matrix')
          "
      - name: ✅ OCR stock-extractor tests (dependency skips are failures)
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.ocr_extractor == 'true' }}
        run: |
          test_data_dir="$(mktemp -d)"
          set +e
          DATABASE_PATH="${test_data_dir}/stockpulse-ci.sqlite" \
            python -m pytest -m "not network" -rs \
            tests/services/test_image_stock_extractor_litellm.py \
            tests/services/test_image_stock_extractor_contract.py \
            tests/services/test_ocr_extraction_service.py \
            tests/agent/tools/test_ocr_tools.py \
            tests/agent/tools/test_ocr_tool_surface_runtime.py \
            tests/config/test_ocr_config.py \
            tests/plugins/test_ocr_agent_tool.py \
            > /tmp/ocr_extractor_pytest.log 2>&1
          status=$?
          set -e
          cat /tmp/ocr_extractor_pytest.log
          rm -rf "${test_data_dir}"
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          if grep -Eq "[0-9]+ skipped" /tmp/ocr_extractor_pytest.log; then
            echo "::error::installed OCR matrix must execute stock-extractor tests, not skip them" >&2
            exit 1
          fi
          if grep -Fq "system Tesseract + pytesseract not installed" /tmp/ocr_extractor_pytest.log; then
            echo "::error::installed OCR matrix must not skip the real Tesseract fixture" >&2
            exit 1
          fi

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, ai-governance]
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: 🐳 Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          tags: stock-analysis:test
          load: true
          cache-from: type=gha,scope=stock-analysis-ci-docker
          cache-to: type=gha,mode=max,scope=stock-analysis-ci-docker,ignore-error=true
      - name: 🐳 Docker smoke
        run: docker run --rm stock-analysis:test python -c "print('✅ Docker OK')"
      - name: 🔍 Docker smoke imports
        run: |
          docker run --rm stock-analysis:test python -c "
          from src.config import get_config; print('✅ config')
          from src.storage import DatabaseManager; print('✅ storage')
          from src.migrations.registry import TARGET_VERSION, get_migrations
          migration_ids = [migration.id for migration in get_migrations()]
          assert migration_ids and migration_ids[-1] == TARGET_VERSION
          print(f'✅ migrations target {TARGET_VERSION}')
          from src.notification import NotificationService; print('✅ notification')
          from src.data_provider import DataFetcherManager; print('✅ data_provider')
          from src.analyzer import GeminiAnalyzer; print('✅ analyzer')
          from src.patches.eastmoney_patch import eastmoney_patch; print('✅ patch')
          from src.bot.dispatcher import CommandDispatcher; print('✅ bot')
          from src.api.app import app; print('✅ api')
          print('✅ All Docker imports OK')
          "
      - name: 🗃️ Docker legacy volume migration smoke
        shell: bash
        run: |
          set -euo pipefail

          volume_name="stockpulse-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fixture_path="${GITHUB_WORKSPACE}/tests/fixtures/schema_migrations/v3_20_0.sql"
          docker volume create "${volume_name}" >/dev/null
          trap 'docker volume rm -f "${volume_name}" >/dev/null' EXIT

          docker run --rm \
            --mount "type=volume,source=${volume_name},target=/app/data" \
            --mount "type=bind,source=${fixture_path},target=/tmp/v3_20_0.sql,readonly" \
            stock-analysis:test python -c "
          from pathlib import Path
          import os
          import sqlite3

          database_path = Path('/app/data/stock_analysis.db')
          assert os.getuid() == 1000
          assert not database_path.exists()
          with sqlite3.connect(database_path) as connection:
              connection.executescript(
                  Path('/tmp/v3_20_0.sql').read_text(encoding='utf-8')
              )
          print('✅ Legacy v3.20.0 fixture loaded into /app/data')
          "

          run_migration_smoke() {
            local phase="$1"
            docker run --rm \
              --env "MIGRATION_SMOKE_PHASE=${phase}" \
              --mount "type=volume,source=${volume_name},target=/app/data" \
              stock-analysis:test python -c "
          from pathlib import Path
          import os

          from src.migrations.registry import TARGET_VERSION, get_migrations
          from src.migrations.runner import MigrationRunner
          from src.storage import DatabaseManager

          assert os.getuid() == 1000
          database = DatabaseManager()
          expected_migrations = [
              (migration.id, migration.description, migration.checksum)
              for migration in get_migrations()
          ]
          with database._engine.connect() as connection:
              migration_rows = [
                  tuple(row)
                  for row in connection.exec_driver_sql(
                      'SELECT version, description, checksum, applied_at '
                      'FROM schema_migrations ORDER BY version'
                  ).fetchall()
              ]
              assert [row[:3] for row in migration_rows] == expected_migrations
              assert all(row[2] and len(row[2]) == 64 for row in migration_rows)
              assert connection.exec_driver_sql(
                  'SELECT code, data_source FROM stock_daily WHERE id = 1'
              ).one() == ('TEST0001', 'fixture')
              assert connection.exec_driver_sql(
                  'SELECT query_id FROM analysis_history WHERE id = 1'
              ).scalar_one() == 'fixture-query-001'
              assert connection.exec_driver_sql(
                  'SELECT owner_id FROM portfolio_accounts WHERE id = 1'
              ).scalar_one() == 'fixture-owner'
              assert connection.exec_driver_sql(
                  'SELECT trade_uid FROM portfolio_trades WHERE id = 1'
              ).scalar_one() == 'fixture-trade-001'

          verification = MigrationRunner().verify(database._engine)
          assert verification.success is True
          assert verification.current_version == TARGET_VERSION
          assert verification.pending_ids == ()

          snapshot_path = Path('/app/data/migration-smoke-applied-at.txt')
          applied_at_snapshot = '\n'.join(
              f'{row[0]}\t{row[3]}' for row in migration_rows
          )
          assert all(row[3] for row in migration_rows)
          if os.environ['MIGRATION_SMOKE_PHASE'] == 'initial':
              snapshot_path.write_text(applied_at_snapshot, encoding='utf-8')
          else:
              assert snapshot_path.read_text(encoding='utf-8') == applied_at_snapshot
          print(f'✅ Legacy volume migration {os.environ[\"MIGRATION_SMOKE_PHASE\"]}')
          "
          }

          run_migration_smoke initial
          run_migration_smoke restart

  openapi-types-gate:
