name: CI

permissions: {}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 🔎 Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.backend-filter.outputs.backend_non_web == 'true' || steps.filter.outputs.backend_web_contract == 'true' }}
      docker: ${{ steps.filter.outputs.docker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      web_e2e: ${{ steps.filter.outputs.web_e2e }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🧭 Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend_web_contract:
              - 'apps/dsa-web/public/**'
              - 'apps/dsa-web/src/components/settings/llmProviderTemplates.ts'
              - 'apps/dsa-web/src/locales/settingsHelp.ts'
              - 'apps/dsa-web/src/locales/settingsHelp.en.ts'
              - 'apps/dsa-web/src/locales/settingsHelp.zh.ts'
              - 'apps/dsa-web/src/utils/systemConfigI18n.ts'
            docker:
              - '*.py'
              - 'api/**'
              - 'bot/**'
              - 'data_provider/**'
              - 'src/**'
              - 'strategies/**'
              - 'apps/dsa-web/**'
              - 'docker/**'
              - 'requirements.txt'
              - 'constraints.txt'
              - 'build-constraints.txt'
              - '.github/requirements-ci.txt'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/dsa-web/**'
            web_e2e:
              - 'apps/dsa-web/**'
              - 'api/**'
              - 'src/**'
              - 'data_provider/**'
              - 'bot/**'
              - 'main.py'
              - 'server.py'
              - 'requirements.txt'
              - '.github/requirements-ci.txt'
              - '.github/workflows/ci.yml'
      - name: 🧭 Filter backend-safe frontend paths
        id: backend-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            backend_non_web:
              - '**'
              - '!apps/dsa-web/**'
              - '!docs/CHANGELOG.md'
              - '!docs/changelog.d/**'

  ai-governance:
    name: ai-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: 🤖 Check AI governance assets
        run: python scripts/check_ai_assets.py
      - name: 🧾 Validate changelog fragments
        run: python scripts/collect_changelog.py --check
      - name: 🧾 Require changelog entry for product-code PRs
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python scripts/collect_changelog.py --require-entry --base "origin/${{ github.base_ref }}"
