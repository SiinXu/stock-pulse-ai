  report-export-stack:
    name: report-export-stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [ai-governance]
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
            requirements-report-export.txt
      - name: 🔤 Install host fonts for glyph coverage
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu images use mirror+file:/etc/apt/apt-mirrors.txt
          # with azure.archive.ubuntu.com first and archive.ubuntu.com next.
          # A degraded Azure front-end can ignore indexes until a long wrapper
          # fires; keep apt-native timeouts short and retry once against the
          # runner's already-listed public archive. Do not hide missing fonts.
          apt_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
          )
          apt_mirrors="/etc/apt/apt-mirrors.txt"

          prefer_runner_public_archive() {
            if [ ! -f "${apt_mirrors}" ]; then
              echo "GitHub runner apt mirror list ${apt_mirrors} is absent; retrying with apt-native timeouts only."
              return 0
            fi
            tmp="$(mktemp)"
            awk '!/azure[.]archive[.]ubuntu[.]com/' "${apt_mirrors}" > "${tmp}"
            if [ ! -s "${tmp}" ]; then
              rm -f "${tmp}"
              echo "::error::Runner apt mirror list has no non-Azure fallback URI." >&2
              return 1
            fi
            sudo cp "${tmp}" "${apt_mirrors}"
            rm -f "${tmp}"
            echo "Preferred the runner public Ubuntu archive fallback in ${apt_mirrors}."
          }

          install_host_fonts() {
            sudo timeout --kill-after=10s 90s apt-get "${apt_options[@]}" update \
              && sudo timeout --kill-after=10s 150s apt-get "${apt_options[@]}" install \
                -y --no-install-recommends fonts-dejavu-core fonts-noto-cjk
          }

          if ! install_host_fonts; then
            prefer_runner_public_archive
            sudo rm -rf /var/lib/apt/lists/partial
            if ! install_host_fonts; then
              echo "::error::Host font installation failed after one bounded Azure-mirror attempt and one public-archive fallback." >&2
              exit 1
            fi
          fi

          if ! dpkg -s fonts-dejavu-core fonts-noto-cjk >/dev/null 2>&1; then
            echo "::error::Required host font packages are missing after apt install." >&2
            exit 1
          fi
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            echo "::error::DejaVuSans.ttf is missing after host font installation." >&2
            exit 1
          fi
          if ! compgen -G '/usr/share/fonts/opentype/noto/NotoSansCJK*' >/dev/null \
            && ! compgen -G '/usr/share/fonts/truetype/noto/NotoSansCJK*' >/dev/null; then
            echo "::error::Noto CJK font files are missing after host font installation." >&2
            exit 1
          fi
      - name: 📦 Install dependencies (native + optional report export)
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt \
              -r .github/requirements-ci.txt \
              -r requirements-report-export.txt \
              'pypdf>=5,<7'; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 🔎 Assert report-export imports
        run: |
          python -c "
          import importlib.metadata as metadata
          import fpdf  # noqa: F401
          import fontTools  # noqa: F401
          import markdown_it  # noqa: F401
          import pypdf  # noqa: F401
          from src.services.report_export_service import (
              is_html_dependency_available,
              is_pdf_dependency_available,
          )
          assert is_html_dependency_available() is True
          assert is_pdf_dependency_available() is True
          print('fpdf2', metadata.version('fpdf2'))
          print('fonttools', metadata.version('fonttools'))
          print('markdown-it-py', metadata.version('markdown-it-py'))
          print('pypdf', metadata.version('pypdf'))
          print('✅ report-export optional stack importable in the installed matrix')
          "
      - name: ✅ Report export tests (dependency skips are failures)
        run: |
          test_data_dir="$(mktemp -d)"
          set +e
          DATABASE_PATH="${test_data_dir}/stockpulse-ci.sqlite" \
            python -m pytest -m "not network" -rs \
            tests/services/test_report_export_service.py \
            tests/api/test_report_export_api.py \
            tests/config/test_report_export_config.py \
            > /tmp/report_export_pytest.log 2>&1
          status=$?
          set -e
          cat /tmp/report_export_pytest.log
          rm -rf "${test_data_dir}"
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          if grep -Eq "optional (fpdf2|markdown-it-py) not installed" /tmp/report_export_pytest.log; then
            echo "::error::installed report-export matrix must not skip HTML/PDF tests for missing optional packages" >&2
            exit 1
          fi

  ocr-stock-extractor:
    name: ocr-stock-extractor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, ai-governance]
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: 🔒 Validate ocr-stock-extractor prerequisites
        if: >-
