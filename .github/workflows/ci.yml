name: CI

permissions: {}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PRs share a group by PR number; pushes to main share ci-refs/heads/main.
# cancel-in-progress drops superseded runs (merge-burst on main or force-push-like
# rapid PR updates) so only the newest revision keeps consuming runners.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 🔎 Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Backend suite when non-web paths change, or when web paths that are
      # shared runtime/config contracts change (provider templates, help copy,
      # public assets consumed outside the SPA).
      backend: ${{ steps.backend-filter.outputs.backend_non_web == 'true' || steps.filter.outputs.backend_web_contract == 'true' }}
      backend_full: ${{ steps.backend-selection.outputs.full || 'false' }}
      docker: ${{ steps.filter.outputs.docker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      web_e2e: ${{ steps.filter.outputs.web_e2e }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR test planner needs the merge base to distinguish FULL from
          # selective coverage before backend jobs are scheduled.
          fetch-depth: 0
      - name: 🧭 Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Shared web/runtime contracts that still require backend validation.
            backend_web_contract:
              - 'apps/dsa-web/public/**'
              - 'apps/dsa-web/src/components/settings/llmProviderTemplates.ts'
              - 'apps/dsa-web/src/locales/settingsHelp.ts'
              - 'apps/dsa-web/src/locales/settingsHelp.en.ts'
              - 'apps/dsa-web/src/locales/settingsHelp.zh.ts'
              - 'apps/dsa-web/src/utils/systemConfigI18n.ts'
            docker:
              - '*.py'
              - 'src/**'
              - 'strategies/**'
              - 'apps/dsa-web/**'
              - 'docker/**'
              - 'requirements.txt'
              - 'constraints.txt'
              - 'build-constraints.txt'
              - 'pyproject.toml'
              - 'README.md'
              - 'LICENSE'
              - '.github/requirements-ci.txt'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            # web-gate only: frontend lint/unit/build (genuinely frontend-only)
            frontend:
              - 'apps/dsa-web/**'
            # web-e2e boots a real backend; re-run when the stack it imports changes
            web_e2e:
              - 'apps/dsa-web/**'
              - 'src/**'
              - 'main.py'
              - 'server.py'
              - 'requirements.txt'
              - '.github/requirements-ci.txt'
              - '.github/workflows/ci.yml'
      - name: 🧭 Filter backend-safe frontend paths
        id: backend-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # true when any changed path is outside apps/dsa-web/**
          predicate-quantifier: every
          filters: |
            backend_non_web:
              - '**'
              - '!apps/dsa-web/**'
              - '!docs/CHANGELOG.md'
              - '!docs/changelog.d/**'
      - name: 🧪 Plan PR backend test tier
        id: backend-selection
        if: >-
          github.event_name == 'pull_request' &&
          (steps.backend-filter.outputs.backend_non_web == 'true' ||
           steps.filter.outputs.backend_web_contract == 'true')
        env:
          CI_SELECT_BASE: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          selection="$(python scripts/ci_select_tests.py --base "${CI_SELECT_BASE}")"
          if [ "${selection}" = "FULL" ]; then
            echo "full=true" >> "${GITHUB_OUTPUT}"
          else
            echo "full=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "Backend test selection: ${selection}"

  ai-governance:
    name: ai-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: 🤖 Check AI governance assets
        run: python scripts/check_ai_assets.py
      - name: 🧾 Validate changelog fragments
        run: python scripts/collect_changelog.py --check
      - name: 🧾 Require changelog entry for product-code PRs
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python scripts/collect_changelog.py --require-entry --base "origin/${{ github.base_ref }}"

  agent-eval-gate:
    name: agent-eval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, ai-governance]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: Offline agent + prediction eval regression gate
        # Blocking gate for Issues #1092 / #1107. Threshold is fixed at 0.0 on
        # deterministic frozen fixtures — do not relax to keep CI green.
        run: |
          set -o pipefail
          test_data_dir="$(mktemp -d)"
          DATABASE_PATH="${test_data_dir}/stockpulse-agent-eval.sqlite" \
            python scripts/run_agent_benchmark.py --strict-baseline
          DATABASE_PATH="${test_data_dir}/stockpulse-agent-eval.sqlite" \
            python -m pytest -m "not network and not benchmark" \
              tests/services/test_prediction_eval_service.py \
              tests/agent/benchmark/test_regression_gate.py \
              tests/services/test_agent_episode_service.py \
              -q --tb=short
          rm -rf "${test_data_dir}"

  # ---------------------------------------------------------------------------
  # PR tier: fast backend-gate for selective pytest. FULL selections use the
  # sharded suite and summary job below. Required check name: backend-gate.
  # ---------------------------------------------------------------------------
  backend-gate:
    name: backend-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, ai-governance]
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true' && needs.changes.outputs.backend_full != 'true'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Selective offline tests need merge-base vs origin/main on pull_request.
          fetch-depth: 0
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 🔐 Verify dependency supply chain
        run: |
          python scripts/check_dependency_locks.py --verify-generated
          python scripts/check_dependency_vulnerabilities.py --self-test
          python scripts/check_dependency_vulnerabilities.py
      - name: 🧭 Native runtime isolation (no PydanticAI)
        run: |
          python -c "
          import importlib.util
          assert importlib.util.find_spec('pydantic_ai') is None, \
              'pydantic_ai must not be present in the native gate'
          from src.agent.runtime.pydantic_ai_adapter import is_pydantic_ai_available
          assert is_pydantic_ai_available() is False
          from src.agent import factory  # native factory imports without pydantic-ai
          from src.agent.runtime.native_adapter import NativeRuntimeAdapter  # noqa: F401
          from src.agent.runtime.contract import ExecutionContext  # noqa: F401
          print('✅ native gate has no pydantic-ai dependency')
          "
      - name: ✅ Python syntax check
        run: ./scripts/ci_gate.sh syntax
      - name: ✅ Flake8 critical checks
        run: ./scripts/ci_gate.sh flake8
      - name: ✅ Local deterministic checks
        run: ./scripts/ci_gate.sh deterministic
      - name: 🧪 Enforce offline Agent prediction eval baseline
        env:
          DATABASE_PATH: ${{ runner.temp }}/stockpulse-agent-eval.sqlite
        run: python scripts/run_agent_benchmark.py --strict-baseline --quiet
      - name: ✅ Selective offline tests (PR tier)
        env:
          CI_SELECT_BASE: origin/main
        run: |
          git fetch --no-tags --depth=1 origin main 2>/dev/null || true
          ./scripts/ci_gate.sh offline-tests-selective

  # ---------------------------------------------------------------------------
  # Full-suite tier: sharded offline suite for push-to-main and PRs whose path
  # mapping fails closed to FULL. Coverage floor runs once after combine.
  # ---------------------------------------------------------------------------
  backend-tests:
    name: backend-tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, ai-governance]
    if: needs.changes.outputs.backend == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.backend_full == 'true'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 🔐 Verify dependency supply chain
        if: matrix.shard == 1
        run: |
          python scripts/check_dependency_locks.py --verify-generated
          python scripts/check_dependency_vulnerabilities.py --self-test
          python scripts/check_dependency_vulnerabilities.py
      - name: 🧭 Native runtime isolation (no PydanticAI)
        if: matrix.shard == 1
        run: |
          python -c "
          import importlib.util
          assert importlib.util.find_spec('pydantic_ai') is None, \
              'pydantic_ai must not be present in the native gate'
          from src.agent.runtime.pydantic_ai_adapter import is_pydantic_ai_available
          assert is_pydantic_ai_available() is False
          print('✅ native gate has no pydantic-ai dependency')
          "
      - name: ✅ Python syntax check
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh syntax
      - name: ✅ Flake8 critical checks
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh flake8
      - name: ✅ Local deterministic checks
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh deterministic
      - name: ✅ Offline test suite shard ${{ matrix.shard }}/4
        env:
          PYTEST_SPLITS: '4'
          PYTEST_GROUP: ${{ matrix.shard }}
          PYTEST_FIRST_SHARD_OVERHEAD: '30'
          COVERAGE_SHARD_DIR: ${{ runner.temp }}/cov
        run: |
          mkdir -p "${COVERAGE_SHARD_DIR}"
          ./scripts/ci_gate.sh offline-tests-shard
      - name: 📤 Upload shard coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/cov/.coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  backend-gate-main:
    name: backend-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, ai-governance, backend-tests]
    if: always() && needs.changes.outputs.backend == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.backend_full == 'true'))
    permissions:
      contents: read
    steps:
      - name: ✅ Require shard success
        env:
          AI_RESULT: ${{ needs.ai-governance.result }}
          TESTS_RESULT: ${{ needs.backend-tests.result }}
        run: |
          set -euo pipefail
          if [ "${AI_RESULT}" != "success" ]; then
            echo "ai-governance failed: ${AI_RESULT}" >&2
            exit 1
          fi
          if [ "${TESTS_RESULT}" != "success" ]; then
            echo "backend-tests shards failed: ${TESTS_RESULT}" >&2
            exit 1
          fi
          echo "all backend shards passed"
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt
          python -m pip check
      - name: 🧪 Enforce offline Agent prediction eval baseline
        env:
          DATABASE_PATH: ${{ runner.temp }}/stockpulse-agent-eval.sqlite
        run: python scripts/run_agent_benchmark.py --strict-baseline --quiet
      - name: 📥 Download shard coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/cov-in
          pattern: coverage-shard-*
          merge-multiple: true
      - name: ✅ Combine coverage + floor
        env:
          COVERAGE_SHARD_DIR: ${{ runner.temp }}/cov-in
        run: ./scripts/ci_gate.sh offline-tests-combine

  # PR tier: 3.10 smoke (not a second full suite). Push-to-main: full offline
  # suite on 3.10 so the floor runtime stays real on the declared Python floor.
  python-minimum:
    name: python-minimum
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [changes, ai-governance]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 🐍 Setup minimum Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      # PR tier: 3.10 import/schema smoke (not a second full offline suite).
      # Push-to-main: full offline suite on the declared Python floor.
      - name: ✅ Minimum Python smoke (PR tier)
        if: github.event_name == 'pull_request'
        run: ./scripts/ci_gate.sh python-min-smoke
      - name: ✅ Minimum Python full offline suite (push-to-main)
        if: github.event_name != 'pull_request'
        run: ./scripts/ci_gate.sh offline-tests

  pydanticai-installed:
    name: pydanticai-installed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ai-governance]
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
            requirements-pydanticai.txt
      - name: 📦 Install dependencies (native + optional PydanticAI)
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt -r requirements-pydanticai.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 🔎 Assert PydanticAI import and version
        run: |
          python -c "
          import importlib.metadata as metadata
          import pydantic_ai  # noqa: F401
          print('pydantic-ai-slim', metadata.version('pydantic-ai-slim'))
          from src.agent.runtime.pydantic_ai_adapter import is_pydantic_ai_available
          assert is_pydantic_ai_available() is True
          print('✅ pydantic_ai importable in the installed matrix')
          "
      - name: ✅ Experimental runtime tests (skips are failures)
        env:
          STOCKPULSE_REQUIRE_PYDANTIC_AI: '1'
        run: |
          test_data_dir="$(mktemp -d)"
          set +e
          DATABASE_PATH="${test_data_dir}/stockpulse-ci.sqlite" \
            python -m pytest -m "not network" -rs \
            tests/agent/runtime/test_pydantic_ai_adapter.py \
            tests/agent/runtime/test_native_default.py \
            tests/agent/runtime/test_tool_session.py \
            tests/agent/runtime/test_conformance.py \
            tests/agent/runtime/test_conformance_replay.py \
            tests/agent/runtime/test_pydantic_ai_real_bridge.py \
            tests/agent/runtime/test_conformance_leak_scan.py \
            > /tmp/pydanticai_pytest.log 2>&1
          status=$?
          set -e
          cat /tmp/pydanticai_pytest.log
          rm -rf "${test_data_dir}"
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          if grep -Eq "[0-9]+ skipped" /tmp/pydanticai_pytest.log; then
            echo "::error::installed matrix must execute PydanticAI tests, not skip them (AR-RF-09)" >&2
            exit 1
          fi

  report-export-stack:
    name: report-export-stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [ai-governance]
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
            requirements-report-export.txt
      - name: 🔤 Install host fonts for glyph coverage
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          if ! sudo timeout --kill-after=10s 300s apt-get "${apt_options[@]}" update; then
            echo "::error::Package index refresh failed or timed out after 300 seconds." >&2
            exit 1
          fi
          if ! sudo timeout --kill-after=10s 300s apt-get "${apt_options[@]}" install \
            -y --no-install-recommends fonts-dejavu-core fonts-noto-cjk; then
            echo "::error::Host font installation failed or timed out after 300 seconds." >&2
            exit 1
          fi
      - name: 📦 Install dependencies (native + optional report export)
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt \
              -r .github/requirements-ci.txt \
              -r requirements-report-export.txt \
              'pypdf>=5,<7'; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 🔎 Assert report-export imports
        run: |
          python -c "
          import importlib.metadata as metadata
          import fpdf  # noqa: F401
          import fontTools  # noqa: F401
          import markdown_it  # noqa: F401
          import pypdf  # noqa: F401
          from src.services.report_export_service import (
              is_html_dependency_available,
              is_pdf_dependency_available,
          )
          assert is_html_dependency_available() is True
          assert is_pdf_dependency_available() is True
          print('fpdf2', metadata.version('fpdf2'))
          print('fonttools', metadata.version('fonttools'))
          print('markdown-it-py', metadata.version('markdown-it-py'))
          print('pypdf', metadata.version('pypdf'))
          print('✅ report-export optional stack importable in the installed matrix')
          "
      - name: ✅ Report export tests (dependency skips are failures)
        run: |
          test_data_dir="$(mktemp -d)"
          set +e
          DATABASE_PATH="${test_data_dir}/stockpulse-ci.sqlite" \
            python -m pytest -m "not network" -rs \
            tests/services/test_report_export_service.py \
            tests/api/test_report_export_api.py \
            tests/config/test_report_export_config.py \
            > /tmp/report_export_pytest.log 2>&1
          status=$?
          set -e
          cat /tmp/report_export_pytest.log
          rm -rf "${test_data_dir}"
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          if grep -Eq "optional (fpdf2|markdown-it-py) not installed" /tmp/report_export_pytest.log; then
            echo "::error::installed report-export matrix must not skip HTML/PDF tests for missing optional packages" >&2
            exit 1
          fi

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, ai-governance]
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: 🐳 Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          tags: stock-analysis:test
          load: true
          cache-from: type=gha,scope=stock-analysis-ci-docker
          cache-to: type=gha,mode=max,scope=stock-analysis-ci-docker,ignore-error=true
      - name: 🐳 Docker smoke
        run: docker run --rm stock-analysis:test python -c "print('✅ Docker OK')"
      - name: 🔍 Docker smoke imports
        run: |
          docker run --rm stock-analysis:test python -c "
          from src.config import get_config; print('✅ config')
          from src.storage import DatabaseManager; print('✅ storage')
          from src.migrations.registry import TARGET_VERSION, get_migrations
          migration_ids = [migration.id for migration in get_migrations()]
          assert migration_ids and migration_ids[-1] == TARGET_VERSION
          print(f'✅ migrations target {TARGET_VERSION}')
          from src.notification import NotificationService; print('✅ notification')
          from src.data_provider import DataFetcherManager; print('✅ data_provider')
          from src.analyzer import GeminiAnalyzer; print('✅ analyzer')
          from src.patches.eastmoney_patch import eastmoney_patch; print('✅ patch')
          from src.bot.dispatcher import CommandDispatcher; print('✅ bot')
          from src.api.app import app; print('✅ api')
          print('✅ All Docker imports OK')
          "
      - name: 🗃️ Docker legacy volume migration smoke
        shell: bash
        run: |
          set -euo pipefail

          volume_name="stockpulse-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fixture_path="${GITHUB_WORKSPACE}/tests/fixtures/schema_migrations/v3_20_0.sql"
          docker volume create "${volume_name}" >/dev/null
          trap 'docker volume rm -f "${volume_name}" >/dev/null' EXIT

          docker run --rm \
            --mount "type=volume,source=${volume_name},target=/app/data" \
            --mount "type=bind,source=${fixture_path},target=/tmp/v3_20_0.sql,readonly" \
            stock-analysis:test python -c "
          from pathlib import Path
          import os
          import sqlite3

          database_path = Path('/app/data/stock_analysis.db')
          assert os.getuid() == 1000
          assert not database_path.exists()
          with sqlite3.connect(database_path) as connection:
              connection.executescript(
                  Path('/tmp/v3_20_0.sql').read_text(encoding='utf-8')
              )
          print('✅ Legacy v3.20.0 fixture loaded into /app/data')
          "

          run_migration_smoke() {
            local phase="$1"
            docker run --rm \
              --env "MIGRATION_SMOKE_PHASE=${phase}" \
              --mount "type=volume,source=${volume_name},target=/app/data" \
              stock-analysis:test python -c "
          from pathlib import Path
          import os

          from src.migrations.registry import TARGET_VERSION, get_migrations
          from src.migrations.runner import MigrationRunner
          from src.storage import DatabaseManager

          assert os.getuid() == 1000
          database = DatabaseManager()
          expected_migrations = [
              (migration.id, migration.description, migration.checksum)
              for migration in get_migrations()
          ]
          with database._engine.connect() as connection:
              migration_rows = [
                  tuple(row)
                  for row in connection.exec_driver_sql(
                      'SELECT version, description, checksum, applied_at '
                      'FROM schema_migrations ORDER BY version'
                  ).fetchall()
              ]
              assert [row[:3] for row in migration_rows] == expected_migrations
              assert all(row[2] and len(row[2]) == 64 for row in migration_rows)
              assert connection.exec_driver_sql(
                  'SELECT code, data_source FROM stock_daily WHERE id = 1'
              ).one() == ('TEST0001', 'fixture')
              assert connection.exec_driver_sql(
                  'SELECT query_id FROM analysis_history WHERE id = 1'
              ).scalar_one() == 'fixture-query-001'
              assert connection.exec_driver_sql(
                  'SELECT owner_id FROM portfolio_accounts WHERE id = 1'
              ).scalar_one() == 'fixture-owner'
              assert connection.exec_driver_sql(
                  'SELECT trade_uid FROM portfolio_trades WHERE id = 1'
              ).scalar_one() == 'fixture-trade-001'

          verification = MigrationRunner().verify(database._engine)
          assert verification.success is True
          assert verification.current_version == TARGET_VERSION
          assert verification.pending_ids == ()

          snapshot_path = Path('/app/data/migration-smoke-applied-at.txt')
          applied_at_snapshot = '\n'.join(
              f'{row[0]}\t{row[3]}' for row in migration_rows
          )
          assert all(row[3] for row in migration_rows)
          if os.environ['MIGRATION_SMOKE_PHASE'] == 'initial':
              snapshot_path.write_text(applied_at_snapshot, encoding='utf-8')
          else:
              assert snapshot_path.read_text(encoding='utf-8') == applied_at_snapshot
          print(f'✅ Legacy volume migration {os.environ[\"MIGRATION_SMOKE_PHASE\"]}')
          "
          }

          run_migration_smoke initial
          run_migration_smoke restart

  openapi-types-gate:
    name: openapi-types-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [ai-governance]
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install backend dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 📄 Export OpenAPI schema
        run: python scripts/export_openapi.py --output apps/dsa-web/openapi.json
      - name: 🟢 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: 📦 Install frontend dependencies
        working-directory: apps/dsa-web
        run: npm ci
      - name: 🧬 Regenerate API types
        working-directory: apps/dsa-web
        run: npm run generate:api-types
      - name: 🔍 Fail on OpenAPI / generated-type drift
        run: |
          git diff --exit-code -- apps/dsa-web/openapi.json apps/dsa-web/src/types/api.generated.ts

  web-gate:
    name: web-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, ai-governance]
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - name: 🔒 Validate web-gate prerequisites
        if: >-
          ${{ always() &&
          (needs.ai-governance.result != 'success' ||
          needs.changes.result != 'success' ||
          (needs.changes.outputs.frontend != 'true' &&
          needs.changes.outputs.frontend != 'false')) }}
        working-directory: .
        run: |
          {
            echo "## Web gate"
            echo ""
            echo "A required prerequisite failed or frontend change detection returned an unavailable result, so web-gate fails closed."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: No frontend changes
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'false' }}
        working-directory: .
        run: |
          {
            echo "## Web gate"
            echo ""
            echo "No frontend changes were detected. The full Web lint, i18n, unit test, and build matrix was not required."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 📥 Checkout
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🟢 Setup Node
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: 📦 Install
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        run: npm ci
      - name: 🔎 Lint
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        run: npm run lint
      - name: 🌐 i18n guards
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        run: npm run test:i18n
      - name: 🧪 Unit tests
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        run: npm run test:coverage
      - name: ⏱ Runtime performance budget (soft)
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        working-directory: apps/dsa-web
        run: |
          # Soft gate: prints WARN on exceedance, exits 0 so Web gate stays green
          # while runtime budgets stabilize (Issue #883). Use --strict later.
          node scripts/check-runtime-performance.mjs
      - name: 🏗️ Build
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        run: npm run build
      - name: 📦 Bundle size budget
        if: ${{ needs.ai-governance.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' }}
        run: node scripts/check-bundle-size.mjs --print

  # Observation only: not in the main ruleset required checks. Skip on pull_request
  # so PR throughput stays on the blocking gate; still run on push-to-main when paths match.
  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, ai-governance]
    if: github.event_name == 'push' && needs.changes.outputs.web_e2e == 'true'
    permissions:
      contents: read
    env:
      DSA_PLAYWRIGHT_ARTIFACT_CANARY: stockpulse-playwright-canary-7f91c2a6b43d
      DSA_WEB_E2E_RUN_ID: ci-secret-bearing
      DSA_WEB_E2E_CREDENTIAL_BEARING: "true"
      DSA_WEB_E2E_TRACE: "off"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install backend dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 🟢 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: 📦 Install frontend dependencies
        working-directory: apps/dsa-web
        run: npm ci
      - name: 🔒 Playwright credential safety preflight
        working-directory: apps/dsa-web
        run: npm run test:e2e-security-preflight
      - name: 🎭 Install Playwright browsers
        working-directory: apps/dsa-web
        run: npx playwright install --with-deps chromium
      - name: 🎭 Playwright e2e (including i18n acceptance)
        working-directory: apps/dsa-web
        env:
          # First-run password for Playwright's isolated ENV_FILE; not a real
          # credential and never written to the repository .env.
          DSA_WEB_SMOKE_PASSWORD: dsa-ci-smoke
          # Seeded through native fetch outside Playwright tracing; browser
          # config responses contain only the application's mask token.
          DSA_WEB_E2E_ALPHA_API_KEY: ${{ env.DSA_PLAYWRIGHT_ARTIFACT_CANARY }}
        run: npm run test:smoke
      - name: 🔐 Scan Playwright artifacts for secrets
        id: artifact_scan
        if: always()
        run: python scripts/scan_playwright_artifacts.py "apps/dsa-web/test-results/${DSA_WEB_E2E_RUN_ID}/"
      - name: 📦 Stage allowlisted Playwright diagnostics
        id: artifact_stage
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        env:
          SOURCE_DIR: apps/dsa-web/test-results/${{ env.DSA_WEB_E2E_RUN_ID }}
          STAGING_DIR: ${{ runner.temp }}/playwright-upload
        run: python scripts/stage_playwright_diagnostics.py "${SOURCE_DIR}" "${STAGING_DIR}"
      - name: 🔐 Scan staged Playwright diagnostics
        id: staged_artifact_scan
        if: ${{ always() && steps.artifact_scan.outcome == 'success' && steps.artifact_stage.outcome == 'success' }}
        run: python scripts/scan_playwright_artifacts.py "${{ runner.temp }}/playwright-upload/"
      - name: 📤 Upload scanned Playwright diagnostics
        if: ${{ always() && steps.artifact_scan.outcome == 'success' && steps.artifact_stage.outcome == 'success' && steps.staged_artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: ${{ runner.temp }}/playwright-upload/
          if-no-files-found: error
          retention-days: 7

  # Non-required: exercise tests/api against the real Starlette TestClient.
  # Default offline suite keeps STOCKPULSE_TEST_THREADLESS=1 (threadless client).
  # Observation only — run on push-to-main, not on pull_request.
  api-real-client:
    name: api-real-client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ai-governance]
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐍 Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            build-constraints.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          for attempt in 1 2 3; do
            if python -m pip install --build-constraint build-constraints.txt -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
          python -m pip check
      - name: 🧪 API suite with real Starlette TestClient
        env:
          STOCKPULSE_TEST_THREADLESS: '0'
        run: |
          test_data_dir="$(mktemp -d)"
          set +e
          DATABASE_PATH="${test_data_dir}/stockpulse-ci.sqlite" \
            python -m pytest tests/api -m "not network and not benchmark" -rs \
            > /tmp/api_real_client_pytest.log 2>&1
          status=$?
          set -e
          cat /tmp/api_real_client_pytest.log
          rm -rf "${test_data_dir}"
          exit "${status}"
