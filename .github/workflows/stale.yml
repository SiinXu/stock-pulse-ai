# Mark inactive pull requests (and optionally nudge issues).
# Planning / backlog issues must NOT be auto-closed — they are intentional todos.

name: Stale Issues & PRs

permissions: {}

on:
  schedule:
    # Run daily at 00:00 UTC.
    - cron: '0 0 * * *'
  # Allow manual runs.
  workflow_dispatch:

jobs:
  stale:
    name: 🧹 Clean Up Stale Issues and PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    
    steps:
      - name: 🏷️ Mark and Close Stale Items
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # ===== Issue settings =====
          # Nudge only: never auto-close issues (maintainer planning backlog).
          days-before-issue-stale: 90
          days-before-issue-close: -1
          stale-issue-label: 'stale'
          stale-issue-message: |
            👋 This issue has been inactive for **90 days**.
            
            It remains open as part of the planning backlog. Reply with an update when work resumes, or close it manually if it is no longer needed.
            
            **Issues are not auto-closed for inactivity.**
          close-issue-message: |
            🔒 This issue was closed automatically because it remained inactive.
            
            If the problem still exists, reopen this issue or create a new one with current details.
          
          # ===== Pull request settings =====
          days-before-pr-stale: 21
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: |
            👋 This pull request has been inactive for **21 days**.
            
            Please check whether you need to:
            - Resolve merge conflicts
            - Respond to review feedback
            - Update the code
            
            **This pull request will close automatically if it is not updated within 14 days.**
          close-pr-message: |
            🔒 This pull request was closed automatically because it remained inactive.
            
            If you still want to merge these changes, reopen this pull request or create a new one.
          
          # ===== Exclusions =====
          # Do not mark items with these labels as stale.
          # Include common backlog labels so planning issues are never stale-nudged.
          exempt-issue-labels: 'pinned,security,enhancement,feature,help wanted,good first issue,documentation,P0,P1,P2,P3'
          exempt-pr-labels: 'pinned,security,work-in-progress,wip'
          
          # Exclude draft pull requests.
          exempt-draft-pr: true
          
          # ===== Other settings =====
          # Maximum number of operations per run.
          operations-per-run: 50
          
          # Restrict processing to these labels when configured.
          only-labels: ''
          
          # Remove the stale label when an item receives new activity.
          remove-stale-when-updated: true
          
          # In debug mode, report actions without applying them.
          debug-only: false
