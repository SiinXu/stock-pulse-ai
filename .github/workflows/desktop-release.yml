name: Desktop Release

permissions: {}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Semver tag used to stamp desktop package version and artifact names, e.g. v3.26.3 or v0.1.0'
        required: true
        type: string
      rebuild_from_tag:
        description: 'Checkout release_tag source for a historical rebuild (default false: build the workflow ref; required for post-rename StockPulse packaging verification)'
        required: false
        type: boolean
        default: false

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      REBUILD_FROM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_from_tag || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "Tag-push build at $(git rev-parse --short HEAD) for ${RELEASE_TAG}"
            exit 0
          fi
          git fetch --tags --force
          git rev-parse "${RELEASE_TAG}" >/dev/null
          if [[ "${REBUILD_FROM_TAG}" == "true" ]]; then
            echo "Historical rebuild: checking out ${RELEASE_TAG}"
            git checkout "${RELEASE_TAG}"
          else
            echo "Verification build: workflow ref $(git rev-parse --short HEAD) stamped as ${RELEASE_TAG}"
            echo "Set rebuild_from_tag=true only to rebuild pre-rename tag source (not StockPulse packaging)."
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            constraints.txt
            build-constraints.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/dsa-web/package-lock.json
            apps/dsa-desktop/package-lock.json

      - name: Sync desktop app version from release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export VERSION="${RELEASE_TAG#v}"
          cd apps/dsa-desktop
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          node -e "const pkg = require('./package.json'); if (pkg.version !== process.env.VERSION) throw new Error('package version mismatch: ' + pkg.version); console.log('desktop version:', pkg.version);"

      - name: Build desktop package (Windows)
        shell: pwsh
        env:
          DSA_SKIP_DEVMODE_CHECK: 'true'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-all.ps1

      - name: Prepare release artifact (Windows)
        shell: pwsh
        run: |
          $expectedInstallerName = "stockpulse-windows-installer-$env:RELEASE_TAG.exe"
          $installerPath = Join-Path 'apps/dsa-desktop/dist' $expectedInstallerName
          $installerExe = Get-Item -Path $installerPath -ErrorAction SilentlyContinue
          if (-not $installerExe) {
            Write-Host 'Available dist files:'
            Get-ChildItem -Path 'apps/dsa-desktop/dist' -File -ErrorAction SilentlyContinue | Sort-Object Name | Format-Table Name, Length
            throw "No expected NSIS installer found under apps/dsa-desktop/dist: $expectedInstallerName"
          }
          $winUnpacked = 'apps/dsa-desktop/dist/win-unpacked'
          if (-not (Test-Path $winUnpacked)) {
            throw 'No win-unpacked directory found under apps/dsa-desktop/dist.'
          }
          $embeddedRuntime = Join-Path $winUnpacked 'resources/ollama/ollama.exe'
          $embeddedHelper = Join-Path $winUnpacked 'resources/ollama/lib/ollama/llama-server.exe'
          $embeddedManifest = Join-Path $winUnpacked 'resources/ollama/runtime-manifest.json'
          $thirdPartyNotices = Join-Path $winUnpacked 'resources/THIRD_PARTY_NOTICES'
          foreach ($requiredPath in @($embeddedRuntime, $embeddedHelper, $embeddedManifest, $thirdPartyNotices)) {
            if (-not (Test-Path $requiredPath -PathType Leaf)) {
              throw "Desktop package is missing required embedded runtime resource: $requiredPath"
            }
          }
          $embeddedRoot = Join-Path $winUnpacked 'resources/ollama'
          node -e "const p=require('./scripts/prepare-embedded-ollama'); p.verifyPreparedOllama({platform:'win32',arch:'x64',outputDir:process.argv[1]}).then(m=>console.log('verified embedded Ollama',m.version,m.platform,m.architecture)).catch(e=>{console.error(e);process.exit(1)})" $embeddedRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Embedded Ollama manifest or complete runtime-file checksum validation failed.'
          }
          New-Item -ItemType Directory -Path 'dist/release-assets' -Force | Out-Null
          $exeTarget = "dist/release-assets/$expectedInstallerName"
          $zipTarget = "dist/release-assets/stockpulse-windows-noinstall-$env:RELEASE_TAG.zip"
          Copy-Item -Path $installerExe.FullName -Destination $exeTarget -Force
          Compress-Archive -Path $winUnpacked -DestinationPath $zipTarget -CompressionLevel Optimal -Force
          Get-ChildItem -Path 'apps/dsa-desktop/dist' -File |
            Where-Object { $_.Name -eq 'latest.yml' -or $_.Name -like '*.blockmap' } |
            ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "dist/release-assets/$($_.Name)" -Force
            }
          if (-not (Test-Path 'dist/release-assets/latest.yml')) {
            throw 'No latest.yml found under dist/release-assets.'
          }
          $expectedVersion = $env:RELEASE_TAG.TrimStart('v')
          $versionPattern = '^version:\s*[''"]?' + [regex]::Escape($expectedVersion) + '[''"]?\s*$'
          if (-not (Select-String -Path 'dist/release-assets/latest.yml' -Pattern $versionPattern)) {
            throw "latest.yml version does not match release tag $env:RELEASE_TAG."
          }
          $latestText = Get-Content -Path 'dist/release-assets/latest.yml' -Raw
          $pathMatch = [regex]::Match($latestText, '(?m)^\s*path:\s*[''"]?([^''"\r\n]+)[''"]?\s*$')
          if (-not $pathMatch.Success) {
            throw 'latest.yml missing path field.'
          }
          $latestInstallerPath = $pathMatch.Groups[1].Value.Trim()
          if ($latestInstallerPath -ne $expectedInstallerName) {
            throw "latest.yml path ($latestInstallerPath) does not match release installer $expectedInstallerName."
          }
          $urlMatch = [regex]::Match($latestText, '(?m)^\s*-\s*url:\s*[''"]?([^''"\r\n]+)[''"]?\s*$')
          if ($urlMatch.Success -and $urlMatch.Groups[1].Value.Trim() -ne $expectedInstallerName) {
            throw "latest.yml file url ($($urlMatch.Groups[1].Value.Trim())) does not match release installer $expectedInstallerName."
          }
          $expectedBlockmapName = "$expectedInstallerName.blockmap"
          if (-not (Get-ChildItem -Path 'dist/release-assets' -Filter $expectedBlockmapName -File)) {
            throw "No matching blockmap found under dist/release-assets: $expectedBlockmapName"
          }
          Get-ChildItem -Path 'dist/release-assets' -File | Sort-Object Name | Format-Table Name, Length

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-${{ env.RELEASE_TAG }}
          path: dist/release-assets/*
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      REBUILD_FROM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_from_tag || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "Tag-push build at $(git rev-parse --short HEAD) for ${RELEASE_TAG}"
            exit 0
          fi
          git fetch --tags --force
          git rev-parse "${RELEASE_TAG}" >/dev/null
          if [[ "${REBUILD_FROM_TAG}" == "true" ]]; then
            echo "Historical rebuild: checking out ${RELEASE_TAG}"
            git checkout "${RELEASE_TAG}"
          else
            echo "Verification build: workflow ref $(git rev-parse --short HEAD) stamped as ${RELEASE_TAG}"
            echo "Set rebuild_from_tag=true only to rebuild pre-rename tag source (not StockPulse packaging)."
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            constraints.txt
            build-constraints.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/dsa-web/package-lock.json
            apps/dsa-desktop/package-lock.json

      - name: Sync desktop app version from release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export VERSION="${RELEASE_TAG#v}"
          cd apps/dsa-desktop
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          node -e "const pkg = require('./package.json'); if (pkg.version !== process.env.VERSION) throw new Error('package version mismatch: ' + pkg.version); console.log('desktop version:', pkg.version);"

      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-macos-${{ matrix.arch }}-${{ hashFiles('apps/dsa-desktop/package-lock.json') }}
          restore-keys: |
            electron-macos-${{ matrix.arch }}-

      - name: Disable Spotlight indexing (prevents hdiutil Resource busy)
        run: sudo mdutil -a -i off

      - name: Build desktop package (macOS)
        env:
          DSA_MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-all-macos.sh

      - name: macOS launch smoke (codesign audit + binary exec)
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_NAME="$(node -p 'require("./apps/dsa-desktop/package.json").build.productName')"
          shopt -s nullglob
          app_candidates=(apps/dsa-desktop/dist/mac*/"${PRODUCT_NAME}.app")
          shopt -u nullglob
          if [[ "${#app_candidates[@]}" -ne 1 ]]; then
            echo "ERROR: expected one unpacked macOS app for launch smoke, found ${#app_candidates[@]}." >&2
            ls -la apps/dsa-desktop/dist || true
            exit 1
          fi
          APP="${app_candidates[0]}"
          BIN="${APP}/Contents/MacOS/${PRODUCT_NAME}"
          echo "Launch-smoke target arch=${{ matrix.arch }}: ${APP}"
          test -d "${APP}"
          test -x "${BIN}"

          echo "=== codesign -dv --verbose=4 (app bundle only; full-tree audit already ran in build) ==="
          set +e
          codesign_out="$(codesign -dv --verbose=4 "${APP}" 2>&1)"
          codesign_rc=$?
          set -e
          printf '%s\n' "${codesign_out}"
          if [[ ${codesign_rc} -eq 0 ]]; then
            echo "codesign: signature present (inspect output above)."
          else
            if [[ "${codesign_out}" != *"code object is not signed at all"* ]]; then
              echo "ERROR: unreadable or broken signature state (not clean unsigned)." >&2
              exit 1
            fi
            echo "codesign: code object is not signed at all (current unsigned packaging contract)."
          fi

          # Bound launch probes: Electron can hang if the app main process runs instead of
          # exiting on --version. Prefer a hard timeout over a stalled job.
          # Note: perl alarm+exec is unsafe because exec clears the alarm; use a watchdog.
          run_with_timeout() {
            local seconds="$1"
            shift
            local out_file
            out_file="$(mktemp "${TMPDIR:-/tmp}/desktop-launch-out.XXXXXX")"
            "$@" >"${out_file}" 2>&1 &
            local pid=$!
            (
              sleep "${seconds}"
              if kill -0 "${pid}" 2>/dev/null; then
                kill -TERM "${pid}" 2>/dev/null || true
                sleep 1
                kill -KILL "${pid}" 2>/dev/null || true
              fi
            ) &
            local watchdog=$!
            set +e
            wait "${pid}"
            local rc=$?
            set -e
            kill "${watchdog}" 2>/dev/null || true
            wait "${watchdog}" 2>/dev/null || true
            cat "${out_file}"
            rm -f "${out_file}"
            # 137/143 often mean SIGKILL/SIGTERM from the watchdog.
            if [[ ${rc} -eq 137 || ${rc} -eq 143 ]]; then
              return 124
            fi
            return "${rc}"
          }

          attempt_version_launch() {
            local binary="$1"
            local label="$2"
            echo "=== launch attempt (${label}): ${binary} --version (30s timeout) ==="
            set +e
            # ELECTRON_RUN_AS_NODE runs as Node and exits; avoids starting main.js GUI lifecycle.
            launch_out="$(run_with_timeout 30 env ELECTRON_RUN_AS_NODE=1 ELECTRON_ENABLE_LOGGING=0 "${binary}" -e 'console.log(process.versions.electron || process.version)')"
            launch_rc=$?
            set -e
            printf '%s\n' "${launch_out}"
            if [[ ${launch_rc} -eq 124 ]]; then
              echo "launch timed out after 30s (${label})"
              return 1
            fi
            return "${launch_rc}"
          }

          if attempt_version_launch "${BIN}" "as-packaged"; then
            echo "LAUNCH_VERDICT arch=${{ matrix.arch }}: launches_as_packaged"
            exit 0
          fi

          echo "As-packaged launch failed/hung on arch=${{ matrix.arch }}; trying ad-hoc codesign on a disposable copy."
          smoke_root="$(mktemp -d "${TMPDIR:-/tmp}/desktop-launch-smoke.XXXXXX")"
          cleanup_smoke() {
            rm -rf "${smoke_root}"
          }
          trap cleanup_smoke EXIT
          ditto "${APP}" "${smoke_root}/${PRODUCT_NAME}.app"
          SMOKE_APP="${smoke_root}/${PRODUCT_NAME}.app"
          SMOKE_BIN="${SMOKE_APP}/Contents/MacOS/${PRODUCT_NAME}"
          # Sign only the main executable + app bundle identity (avoid multi-minute --deep on full backend tree).
          codesign --force --sign - "${SMOKE_BIN}"
          codesign --force --sign - "${SMOKE_APP}"
          echo "=== codesign -dv after ad-hoc ==="
          codesign -dv --verbose=4 "${SMOKE_APP}" 2>&1 || true

          if attempt_version_launch "${SMOKE_BIN}" "ad-hoc-signed-copy"; then
            echo "LAUNCH_VERDICT arch=${{ matrix.arch }}: requires_adhoc_sign"
            echo "Applying ad-hoc signature to packaging outputs for launchability..."
            codesign --force --sign - "${BIN}"
            codesign --force --sign - "${APP}"
            shopt -s nullglob
            dmg_candidates=(apps/dsa-desktop/dist/*.dmg)
            shopt -u nullglob
            if [[ "${#dmg_candidates[@]}" -ne 1 ]]; then
              echo "ERROR: expected one DMG to rewrite after ad-hoc sign, found ${#dmg_candidates[@]}." >&2
              exit 1
            fi
            old_dmg="${dmg_candidates[0]}"
            signed_stage="$(mktemp -d "${TMPDIR:-/tmp}/desktop-adhoc-dmg.XXXXXX")"
            cp -R "${APP}" "${signed_stage}/${PRODUCT_NAME}.app"
            rm -f "${old_dmg}"
            hdiutil create -volname "${PRODUCT_NAME}" -srcfolder "${signed_stage}" -ov -format UDZO "${old_dmg}"
            rm -rf "${signed_stage}"
            echo "Rewrote DMG with ad-hoc-signed app: ${old_dmg}"
            exit 0
          fi

          echo "LAUNCH_VERDICT arch=${{ matrix.arch }}: launch_failed_even_with_adhoc" >&2
          exit 1

      - name: Prepare release artifact (macOS)
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_NAME="$(node -p 'require("./apps/dsa-desktop/package.json").build.productName')"
          dmg_file="$(ls -t apps/dsa-desktop/dist/*${{ matrix.arch }}*.dmg 2>/dev/null | head -n 1 || true)"
          if [[ -z "${dmg_file}" ]]; then
            dmg_file="$(ls -t apps/dsa-desktop/dist/*.dmg | head -n 1)"
          fi
          test -n "$dmg_file"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg_file" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" >/dev/null 2>&1 || true' EXIT
          app_bundle="$mount_dir/${PRODUCT_NAME}.app"
          test -d "$app_bundle"
          test -x "$app_bundle/Contents/Resources/ollama/ollama"
          test -f "$app_bundle/Contents/Resources/ollama/llama-server"
          test -f "$app_bundle/Contents/Resources/ollama/runtime-manifest.json"
          test -f "$app_bundle/Contents/Resources/THIRD_PARTY_NOTICES"
          node -e 'const p=require("./scripts/prepare-embedded-ollama"); p.verifyPreparedOllama({platform:"darwin",arch:process.argv[2],outputDir:process.argv[1]}).then(m=>console.log("verified embedded Ollama",m.version,m.platform,m.architecture)).catch(e=>{console.error(e);process.exit(1)})' "$app_bundle/Contents/Resources/ollama" '${{ matrix.arch }}'
          # Final launchability check against the DMG-mounted bundle (post any ad-hoc rewrite).
          mounted_bin="$app_bundle/Contents/MacOS/${PRODUCT_NAME}"
          test -x "$mounted_bin"
          echo "=== DMG-mounted codesign -dv ==="
          codesign -dv --verbose=4 "$app_bundle" 2>&1 || true
          echo "=== DMG-mounted Electron runtime probe (30s timeout) ==="
          (
            env ELECTRON_RUN_AS_NODE=1 "$mounted_bin" -e 'console.log(process.versions.electron || process.version)'
          ) &
          _pid=$!
          (
            sleep 30
            if kill -0 "${_pid}" 2>/dev/null; then
              kill -TERM "${_pid}" 2>/dev/null || true
              sleep 1
              kill -KILL "${_pid}" 2>/dev/null || true
            fi
          ) &
          _wd=$!
          if ! wait "${_pid}"; then
            kill "${_wd}" 2>/dev/null || true
            wait "${_wd}" 2>/dev/null || true
            echo "ERROR: DMG-mounted binary --version failed or timed out" >&2
            exit 1
          fi
          kill "${_wd}" 2>/dev/null || true
          wait "${_wd}" 2>/dev/null || true
          hdiutil detach "$mount_dir" >/dev/null
          rmdir "$mount_dir"
          trap - EXIT
          mkdir -p dist/release-assets
          cp "$dmg_file" "dist/release-assets/stockpulse-macos-${{ matrix.arch }}-${RELEASE_TAG}.dmg"
          ls -lah dist/release-assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-${{ matrix.arch }}-${{ env.RELEASE_TAG }}
          path: dist/release-assets/*.dmg
          if-no-files-found: error

  # workflow_dispatch is build+artifact verification only. Publishing attaches
  # assets to a GitHub Release and must only run on tag push (real cut).
  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: dist/release-assets
          merge-multiple: true

      - name: Show release assets
        run: ls -lah dist/release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: false
          files: dist/release-assets/*
          fail_on_unmatched_files: true
