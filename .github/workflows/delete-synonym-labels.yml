# One-shot: delete synonym labels left after issue curation v3.
# Removed from the branch after a successful run so it does not land on main.

name: Delete synonym labels

permissions: {}

on:
  push:
    paths:
      - '.github/workflows/delete-synonym-labels.yml'
  workflow_dispatch:

jobs:
  delete:
    name: Delete unused synonym labels
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - name: Delete unused synonym labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const names = [
              'P1 High',
              'feature',
              'configuration',
              'ci/cd',
              'strategy',
              'tool',
            ];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            for (const name of names) {
              try {
                await github.rest.issues.deleteLabel({ owner, repo, name });
                core.info(`deleted ${name}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`${name} already absent`);
                  continue;
                }
                throw error;
              }
            }
