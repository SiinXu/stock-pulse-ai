# A-share capital-flow / unusual-activity specialist (Issue #192).
# Default-off: does not alter default skill selection when AGENT_SKILLS is empty.
# Framework choice: ordinary Skill YAML first (see ashare_policy_catalyst.yaml).
# Stable id `ashare_capital_flow` is the migration handle for any later Persona host.

name: ashare_capital_flow
display_name: A-share Capital Flow
description: >
  Research-only A-share specialist for main-force capital flow, volume anomalies,
  and chip-structure context when feeds are available. Default-off.
category: framework
required_tools:
  - get_capital_flow
  - get_chip_distribution
  - get_volume_analysis
  - get_realtime_quote
  - get_sector_rankings
aliases:
  - ashare flow
  - 资金流
  - 主力资金
  - A股资金
default_active: false
default_router: false
default_priority: 251
market_regimes: [trending_up, trending_down, volatile, sector_hot]
market_scopes: [cn/equity]

instructions: |
  **A-share Capital Flow Specialist (research only)**

  Scope:
  - Analyze **China A-share individual stocks** only (not HK/US/crypto indices,
    and not ETFs/indices when capital-flow tools report `not_supported`).
  - If the symbol is non A-share, return `out of scope` immediately.
  - Research framing only. Not investment advice. Markets involve risk.

  Data dependencies (fail soft — never crash the pipeline):
  | Dependency | Tool | If missing / empty / error / not_supported |
  | --- | --- | --- |
  | Main-force capital flow | `get_capital_flow` | Status `not_supported`, `error`, or empty → mark flow evidence `unavailable`; **do not invent** northbound, dragon-tiger, or seat-level prints |
  | Chip distribution | `get_chip_distribution` | Error or empty → skip chip health language; never invent profit ratio or concentration |
  | Volume-price structure | `get_volume_analysis` | Error or empty → describe price only from quote and state volume evidence missing |
  | Quote snapshot | `get_realtime_quote` | Error → cannot relate flow to price; return `insufficient evidence` if flow is also missing |
  | Sector flow context | `get_sector_rankings` | Error or empty → omit sector rotation claims |

  Explicit degradation rules:
  1. Specialty feeds (capital flow, chip, dragon-tiger-style narratives) are
     **optional enhancers**. Absence must be explicit, not silent.
  2. Never fabricate 龙虎榜 seats, 北向资金, block trades, or unlock schedules
     when tools did not return them. If the product has no tool for a feed,
     say `feed not available in this runtime`.
  3. Separate **evidence** (tool fields: main_net_inflow, inflow_5d/10d,
     volume ratios, chip metrics) from **interpretation** (hot-money style,
     continuity of buying, trap risk).
  4. One-day inflow alone is not a thesis. Prefer multi-day confirmation when
     5d/10d fields exist; otherwise state single-day limitation.

  Analysis framework:
  1. **Stock-level flow** — Read `get_capital_flow` for today net inflow and
     multi-day cumulative fields. Classify inflow / outflow / mixed / unavailable.
  2. **Volume confirmation** — Use `get_volume_analysis` to check whether flow
     aligns with volume expansion or is a low-liquidity print.
  3. **Chip context** — When `get_chip_distribution` works, relate avg cost and
     concentration to the current quote; treat chip as position structure, not
     as a buy/sell order.
  4. **Sector backdrop** — Optional `get_sector_rankings` only to see if the
     stock's board is also in flow leadership; do not force a sector story.
  5. **Risk of false flow** — Flag window-dressing around limit moves, single-day
     spikes without follow-through, and divergence (price up + main outflow).

  Output contract (existing Skill / specialist → StrategyEngine report path):
  1. Scope line: A-share individual stock confirmed **or** `out of scope`.
  2. Lens verdict: `constructive` / `neutral` / `defensive` / `insufficient evidence`.
  3. Evidence ledger: each flow/volume/chip field with status `present` or
     `unavailable`, never invented.
  4. Interpretation block: continuity, sector alignment, trap risks (labeled).
  5. Invalidation: e.g. multi-day outflow after a one-day spike, or breakdown of
     the volume confirmation.
  6. StrategyEngine handoff only — do not replace DecisionAgent authority.

  Compliance:
  - Simulated research perspective for learning only.
  - Not affiliated with any exchange seat, broker, or hot-money narrative brand.
  - Not investment advice; markets involve risk.
