# setup.cfg now holds ONLY flake8 + pytest (Refs #167 / ADR-006 stage 4).
#
# [flake8] stays here because flake8 7.x discovers only setup.cfg / tox.ini /
# .flake8 (flake8.options.config._find_config_file). It cannot read
# pyproject.toml.
#
# [tool:pytest] stays here because
# tests/test_ci_workflow.py::test_pytest_testpaths_scopes_to_tests_package
# parses this file and asserts `testpaths = tests`. scripts/ci_select_tests.py
# treats setup.cfg as a FULL-suite trigger. Do not move pytest config.
#
# isort lives in pyproject.toml [tool.isort].
# mypy stays in mypy.ini because scripts/ci_gate.sh hardcodes
# `--config-file mypy.ini`.

[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    .env,
    venv,
    .venv,
    .venv*,
    .worktrees,
    build,
    dist,
    local,
    node_modules,
    */node_modules/*,
    *.egg-info
# E501: The line is too long(Some places really need long-term trading)
# W503: Operator conflicts with black on line break
# E203: Spaces before slicing (conflicts with black)
# E402: Module-level imports are not at the top of the file (sometimes requires setting environment variables first)
ignore = E501,W503,E203,E402

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# --strict-markers: fail collection on unregistered markers (fail closed).
# Timeout and coverage flags stay on the CI gate invocation so local long
# debugging runs are not forced through the same limits.
addopts = -v --tb=short --strict-markers
norecursedirs =
    .git
    __pycache__
    .env
    venv
    .venv
    .venv*
    .worktrees
    build
    dist
    local
    node_modules
    */node_modules/*
markers =
    unit: fast offline unit tests
    integration: service-level integration tests without external network dependency
    network: tests requiring external network or third-party services
    quality_benchmark: offline fixed-panel analysis quality fixtures (no live LLM)
    benchmark: wall-clock / throughput assertions that may flaky-fail on noisy CI runners; excluded from the default offline gate
